function confetti(){
  if(typeof window.matchMedia!=='function'||window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=document.getElementById('confetti');if(!c||!c.getContext)return;
  const box=c.parentNode.getBoundingClientRect();c.width=box.width;c.height=box.height;
  const g=c.getContext('2d'),cs=getComputedStyle(document.documentElement);
  const style=S.look.celeb,cols=(style==='gold'?['--r-gold','--flame','--r-gold']:style==='prism'?['--r-champion','--r-diamond','--r-platinum','--r-gold','--r-emerald']:['--r-gold','--r-platinum','--r-diamond','--r-champion','--accent','--flame']).map(v=>cs.getPropertyValue(v).trim()||'#f2c443');
  const P=Array.from({length:110},()=>({x:c.width/2,y:c.height*.38,vx:(Math.random()-.5)*10,vy:-Math.random()*8-3,s:5+Math.random()*5,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:pick(cols)}));
  const t0=performance.now();
  (function f(t){g.clearRect(0,0,c.width,c.height);const k=(t-t0)/1800;if(k>1||ov.hidden)return;g.globalAlpha=1-k*k;
    for(const p of P){p.vy+=.25;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;g.save();g.translate(p.x,p.y);g.rotate(p.r);g.fillStyle=p.c;g.strokeStyle=p.c;
      if(style==='bubbles'){g.lineWidth=2;g.beginPath();g.arc(0,0,p.s*.7,0,6.3);g.stroke()}
      else if(style==='stars'){g.beginPath();for(let k=0;k<10;k++){const rr=k%2?p.s*.45:p.s,an=k*Math.PI/5;g.lineTo(Math.cos(an)*rr,Math.sin(an)*rr)}g.closePath();g.fill()}
      else if(EMOJI_CEL[style]){g.font=`${Math.round(p.s*2.8)}px system-ui,sans-serif`;g.textAlign='center';g.fillText(EMOJI_CEL[style],0,0)}

      else g.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);

    requestAnimationFrame(f)})(t0);
}

G.fInt=()=>{const a=rnz(-15,15),b=rnz(-15,15),op=pick(['+','−','×','÷']);
  if(op==='÷'){const q=rnz(-12,12),d=rnz(-9,9);return{ask:'Evaluate.',eq:`${N(q*d)} ÷ ${P(d)}`,a:q,hint:'Same signs → positive. Different signs → negative.',steps:[`${N(q*d)} ÷ ${P(d)} = ${N(q)}`]}}
  const v=op==='+'?a+b:op==='−'?a-b:a*b;return{ask:'Evaluate.',eq:`${N(a)} ${op} ${P(b)}`,a:v,hint:op==='−'?'Subtracting a number is adding its opposite.':op==='×'?'Same signs → positive. Different signs → negative.':'Think of a number line.',steps:[op==='−'?`${N(a)} + ${P(-b)} = ${N(v)}`:`= ${N(v)}`]}};
G.fOrder=()=>pick([
 ()=>{const a=ri(2,12),b=ri(2,9),c=ri(2,9);return{ask:'Evaluate.',eq:`${a} + ${b} × ${c}`,a:a+b*c,hint:'Multiply before you add.',steps:[`${b} × ${c} = ${b*c}`,`${a} + ${b*c} = ${a+b*c}`]}},
 ()=>{const a=ri(2,9),b=ri(2,9),c=ri(2,6),d=ri(1,10);return{ask:'Evaluate.',eq:`(${a} + ${b}) × ${c} − ${d}`,a:(a+b)*c-d,hint:'Parentheses first, then multiply, then subtract.',steps:[`${a} + ${b} = ${a+b}`,`${a+b} × ${c} = ${(a+b)*c}`,`${(a+b)*c} − ${d} = ${(a+b)*c-d}`]}},
 ()=>{const a=ri(10,40),b=ri(2,5);return{ask:'Evaluate.',eq:`${a} − ${b}${sup(2)}`,a:a-b*b,hint:'Exponents come before subtraction.',steps:[`${b}² = ${b*b}`,`${a} − ${b*b} = ${a-b*b}`]}},
 ()=>{const c=ri(2,6),q=ri(2,9),a=ri(1,9);return{ask:'Evaluate.',eq:`${c*q} ÷ ${c} + ${a} × 2`,a:q+2*a,hint:'Do ÷ and × left to right first. Then add.',steps:[`${c*q} ÷ ${c} = ${q}`,`${a} × 2 = ${2*a}`,`${q} + ${2*a} = ${q+2*a}`]}},
])();
G.fFrac=()=>{const q=pick([2,3,4,5,6,8]),s=pick([2,3,4,6]),p=ri(1,q-1),r=ri(1,s-1),op=pick(['+','−','×','÷']);let n,d;
  if(op==='+'){n=p*s+r*q;d=q*s}else if(op==='−'){n=p*s-r*q;d=q*s}else if(op==='×'){n=p*r;d=q*s}else{n=p*s;d=q*r}
  const [nn,dd]=sgn(n,d);return{ask:'Evaluate. Fractions are OK, like 5/6.',eq:`${fr(p,q)} ${op} ${fr(r,s)}`,a:nn/dd,show:fracStr(nn,dd),
  hint:op==='+'||op==='−'?'Get a common denominator first.':op==='×'?'Multiply the tops. Multiply the bottoms.':'Keep, change, flip: multiply by the reciprocal.',
  steps:[op==='÷'?`${p}/${q} × ${s}/${r}`:op==='×'?`(${p} × ${r}) / (${q} × ${s})`:`${p*s}/${q*s} ${op} ${r*q}/${q*s}`,`= ${fracStr(nn,dd)}`]}};
G.fDec=()=>pick([
 ()=>{const a=ri(11,99)/10,b=ri(11,99)/10,op=pick(['+','−']),v=+(op==='+'?a+b:a-b).toFixed(1);return{ask:'Evaluate.',eq:`${a} ${op} ${b}`,a:v,show:dec(v),hint:'Line up the decimal points.',steps:[`= ${dec(v)}`]}},
 ()=>{const a=ri(11,99)/10,b=ri(2,9),v=+(a*b).toFixed(1);return{ask:'Evaluate.',eq:`${a} × ${b}`,a:v,show:dec(v),hint:'Multiply like whole numbers. Then place the decimal.',steps:[`${a*10} × ${b} = ${a*10*b}`,`= ${dec(v)}`]}},
 ()=>{const b=ri(2,8),q=ri(11,99)/10,a=+(q*b).toFixed(1);return{ask:'Evaluate.',eq:`${a} ÷ ${b}`,a:q,show:dec(q),hint:'Divide like whole numbers. Keep the decimal in place.',steps:[`= ${dec(q)}`]}},
])();

/* ======================================================================
   DAILY WARM-UP — the only streak. 3 quick questions from topics the student passed (unit test)
   or mastered; if none, topics they've gotten right; if none, Foundations.
   A miss replaces that question (same topic, new numbers). All 3 right = streak for today.
   Every day counts. Warm-up answers don't change mastery or RP.
   ====================================================================== */
const WARM_N=3;
S.warmDays=S.warmDays||{};
const warmDone=()=>!!S.warmDays[today()];
function warmPool(){
  const all=UNITS.flatMap(u=>u.topics.map(t=>[t[0],u.n]));
  let pool=all.filter(([id,n])=>unitPassed(n)||topicMastered(id)).map(x=>x[0]);
  if(!pool.length)pool=all.filter(([id])=>T(id).c>0).map(x=>x[0]);
  if(!pool.length)pool=FOUND.topics.map(t=>t[0]);
  return pool;
}
function startWarm(){
  if(warmDone()&&!S.teacher){toast(`Warm-up done today · ${dayStreak()}-day streak`,'up');return}
  const pool=shuffle(warmPool()),topics=[];for(let i=0;i<WARM_N;i++)topics.push(pool[i%pool.length]);
  st.mode='warm';st.screen='practice';st.warm={topics,i:0,misses:0};st.sess={c:0,t:0,streak:0,rp:0};newProblem();window.scrollTo(0,0);
}
function gradeWarm(correct,choiceBtn){
  if(st.done)return;st.done=true;st.warm.ok=!!correct;if(!correct){st.warm.misses++;addMistake(st.p.topic)}
  sfx(correct?'good':'bad');practice();if(choiceBtn!=null)markChoices(choiceBtn);
  if(correct)feedback('good',st.warm.i>=WARM_N-1?'Correct! That\'s all 3.':'Correct!');
  else feedback('bad',`The answer is ${st.p.show}. Here's how:${stepsHTML(st.p)}<div>Try a new one with different numbers.</div>`);
}
function warmNext(){if(!st.warm.ok){newProblem();return}st.warm.i++;if(st.warm.i>=WARM_N)finishWarm();else newProblem()}
function finishWarm(){
  S.warmDays[today()]=1;save();st.mode=null;st.screen='results';const n=dayStreak();sfx('mission');let gotShield=false;if(n>0&&n%7===0&&(S.shields||0)<2){S.shields=(S.shields||0)+1;gotShield=true;save()}
  app.innerHTML=`<div class="runres pass warmdone"><div class="flamebig">${ICON.flame}</div><div class="bigscore">${n}</div><div class="verdict">${n===1?'Day streak started':'Day streak'}</div>
  <div class="ts">${st.warm.misses?`All 3 right after ${st.warm.misses} redo${st.warm.misses>1?'s':''}.`:'3 for 3 on the first try.'} Come back tomorrow to keep it going.${gotShield?' You earned a streak shield. It saves your streak if you miss a day.':''}</div></div>
  <div class="actions"><button class="btn" data-go="home">Home</button></div>${foot}`;
  window.scrollTo(0,0);checkBadges();
}

/* ======================================================================
   FIX THE MISTAKE — in Unit 1 equation topics, about 1 in 6 practice problems shows a worked
   solution with one wrong step. Students pick the step with the mistake.
   ====================================================================== */
const FIXABLE=new Set(['twoStep','distrib','bothSides','rational','eqWord']),FIX_RATE=1/6;
const FIXMSG={x:'The x terms were combined wrong in that step.',c:'The numbers were combined wrong in that step. Check the sign.',div:'The sign is wrong after dividing.',mul:'They multiplied by the number instead of its reciprocal.'};
function makeFix(p){
  const o=p.solve[2]||{},pre=(o.pre||[]).length,solverN=p.work.moves.length-pre;if(solverN<1)return null;
  for(let t=0;t<8;t++){
    const j=ri(0,solverN-1);let bad;try{bad=solveWork(p.solve[0],p.solve[1],Object.assign({},o,{err:j}))}catch(e){continue}
    if(!bad.errKind||!Number.isFinite(bad.ans)||Math.abs(bad.ans-p.work.ans)<1e-9||bad.moves.length!==p.work.moves.length)continue;
    const k=pre+j+1,labels=Array.from({length:bad.moves.length},(_,i)=>'Step '+(i+1));if(labels.length<2)return null;
    return{type:'choice',fix:true,ask:'Find the mistake. Which step is wrong?',vis:workHTML(bad,Infinity,true),choices:labels,a:'Step '+k,show:'Step '+k,
      hint:'Check each step. Is the same move done to both sides? Is the arithmetic right?',steps:[FIXMSG[bad.errKind]],work:p.work};
  }
  return null;
}

  const k=o.wrong.findIndex((s,i)=>s!==o.right[i]);if(k<0||o.wrong.length<2)return null;
  const list=`<ol class="fixsteps">${o.wrong.map((s,i)=>`<li><span class="wst">Step ${i+1}</span><span>${s}</span></li>`).join('')}</ol>`;
  return{type:'choice',fix:true,ask:`${o.lead} Find the mistake. Which step is wrong?`,eq:o.eq,eq2:o.eq2,vis:`<div class="fixwrap">${o.vis||''}${list}</div>`,
    choices:o.wrong.map((_,i)=>'Step '+(i+1)),a:'Step '+(k+1),show:'Step '+(k+1),hint:o.hint||'Check each step. Is the rule right? Is the arithmetic right?',steps:[o.why],fixRight:o.right};
}

/* ======================================================================
   MY MISTAKES — every first-try miss saves that topic (up to 3 per topic).
   Review gives new numbers. Each first-try correct answer clears one.
   ====================================================================== */
S.mist=S.mist||{};
const mistTotal=()=>Object.values(S.mist).reduce((a,b)=>a+b,0);
function addMistake(id){if(!id)return;S.mist[id]=Math.min(3,(S.mist[id]||0)+1);save()}
function clearMistake(id){if(!S.mist[id])return false;S.mist[id]--;if(!S.mist[id])delete S.mist[id];save();return true}
function mistCard(){const n=mistTotal();if(!n)return '';const k=Object.keys(S.mist).length;
  return `<div class="mistrow"><div><b>My Mistakes</b><span class="ts"> · ${n} to fix in ${k} topic${k>1?'s':''}</span></div><button class="btn small" data-act="mist">Review</button></div>`}
function startMist(){
  const bag=Object.entries(S.mist).flatMap(([id,c])=>Array(c).fill(id));if(!bag.length)return;
  const q=shuffle(bag).slice(0,5);st.mode='mist';st.screen='practice';st.mq={q,i:0,fixed:0};st.sess={c:0,t:0,streak:0,rp:0};newProblem();window.scrollTo(0,0);
}
function mistNext(){st.mq.i++;if(st.mq.i>=st.mq.q.length){mistDone();return}newProblem()}
function mistDone(){
  st.mode=null;st.screen='results';const left=mistTotal();
  app.innerHTML=`<div class="runres ${st.mq.fixed?'pass':''}"><div class="eyebrow">My Mistakes</div><div class="bigscore">${st.mq.fixed}</div>
  <div class="ts">mistake${st.mq.fixed===1?'':'s'} fixed · ${left?`${left} left`:'All clear!'}</div></div>
  <div class="actions">${left?'<button class="btn" data-act="mist">Keep going</button>':''}<button class="btn ghost" data-go="home">Home</button></div>${foot}`;window.scrollTo(0,0);
}

const enc=o=>'LPM1:'+btoa(unescape(encodeURIComponent(JSON.stringify(o))));
function dec64(t){t=String(t).trim();if(t.startsWith('LPM1:'))t=decodeURIComponent(escape(atob(t.slice(5))));return JSON.parse(t)}
function backupScreen(msg){
  st.screen='backup';const last=S.lastBackup;
  app.innerHTML=`<button class="back" data-go="home">← Home</button><div class="eyebrow">Backup</div><h1>Save or load my progress</h1>
  <p class="lede">Your progress lives on this device only. Nothing is sent anywhere. Save a backup so you never lose your rank, streak, or unlocks.${last?` Last backup: ${last}.`:''}</p>
  <div class="bk"><div class="ltag">Save</div>
    <label for="bkname" class="ts">Your first name (for the file name)</label><input id="bkname" class="bkin" maxlength="30" value="${(S.name||'').replace(/"/g,'')}" autocomplete="off">
    <div class="actions" style="justify-content:flex-start"><button class="btn small" data-act="bkfile">Download save file</button><button class="btn ghost small" data-act="bkcopy">Copy save code</button></div>
    <textarea id="bkcode" class="bkcode" readonly hidden></textarea></div>
  <div class="bk"><div class="ltag">Load</div>
    <label for="bkfilein" class="ts">Open a save file</label><input id="bkfilein" type="file" accept=".launchpad,.json,.txt">
    <label for="bkpaste" class="ts">Or paste a save code</label><textarea id="bkpaste" class="bkcode" placeholder="LPM1:…"></textarea>
    <div class="actions" style="justify-content:flex-start"><button class="btn ghost small" data-act="bkload">Load progress</button></div>
    <div id="bkmsg" class="ts">${msg||''}</div></div>${foot}`;
  document.getElementById('bkfilein').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{document.getElementById('bkpaste').value=r.result;askLoad()};r.readAsText(f)});
  window.scrollTo(0,0);
}
function bkName(){const v=(document.getElementById('bkname').value||'').trim().replace(/[^A-Za-z0-9 _-]/g,'');S.name=v;return v||'Student'}
function bkFile(){const name=bkName(),data=JSON.stringify(S);S.lastBackup=today();save();
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=`${name}.launchpad`;document.body.appendChild(a);a.click();a.remove();
    document.getElementById('bkmsg').textContent=`Saved ${name}.launchpad. If nothing downloaded, use Copy save code instead.`}catch(e){bkCopy()}}

   Fail: missed topics are flagged and lose mastery until re-mastered (8 of 10 again).
   Retake needs every flagged topic re-mastered AND a different day than the last attempt.
   Passing completes the unit. Champion I needs all 10 passed. 100% on all 10 = Master rank.
   ====================================================================== */
const TEST_PER_TOPIC=2, TEST_PASS=0.8, TEST_WIN=20, TEST_BONUS=100;

function startTest(){

    const q=[];u.topics.forEach(([id])=>{for(let k=0;k<TEST_PER_TOPIC;k++)q.push(id)});

/* ---- Warm start: easier numbers while a topic is new or shaky ---- */
function rampLevel(id){
  if(!PREF('ramp',true))return 2;
  const r=T(id).recent;if(r.length>=MASTER_WINDOW&&recentRight(id)>=MASTER_NEED)return 2;
  const l=r.slice(-5);if(l.length<3)return 0;
  const a=l.filter(Boolean).length/l.length;return a>=.8?2:a>=.5?1:0;
}
function complexity(p){
  const txt=(p.ask+' '+(p.eq||'')+' '+(p.eq2||'')+' '+(p.show||'')).replace(/<[^>]*>/g,' ');
  const digits=(txt.match(/\d/g)||[]).length,neg=(txt.match(/[−-]\d/g)||[]).length,dec=(txt.match(/\d\.\d/g)||[]).length;
  const steps=p.work?p.work.moves.length:(p.steps||[]).length;
  return digits+neg*3+dec*3+steps*4;
}
function genEasy(id){
  const lv=rampLevel(id);if(lv>=2){const p=gen(id);p.ramp=2;return p}
  let best=null,bs=1e9;for(let i=0;i<(lv===0?8:4);i++){const p=gen(id),s=complexity(p);if(s<bs){bs=s;best=p}}
  best.ramp=lv;return best;
}

BOX_ITEMS.forEach(([cat,id,nm,r,l,d])=>LOCKER[cat].items.push(cat==='accent'?[id,nm,'Box '+id,l,d]:[id,nm,'Box '+id]));
(function(){
  const rm=reqMet,rl=reqLabel,ir=isRankReq;
  reqMet=function(req){let m;if(req&&(m=req.match(/^Box (\w+)$/)))return !!S.teacher||!!(S.boxOwned||{})[m[1]];return rm(req)};
  // item-level: Locker asks reqMet(it[2]); boxed items are owned individually
  reqLabel=function(req){if(/^Box /.test(req))return `${BOXSVG} Mystery box only`;return rl(req)};
  isRankReq=r=>ir(r)&&!/^Box /.test(r||'');

function prevSchoolDay(d){const x=new Date(d);do x.setDate(x.getDate()-1);while(offDay(x));return x}

  const t=today(),prev=dayKey(prevSchoolDay(new Date()));
  if(S.boxLast===t)return;
  S.boxProg=(S.boxLast===prev?(S.boxProg||0):0)+1;S.boxLast=t;

function openBox(){
  if(!(S.boxes>0))return;
  const roll=Math.random()*100;let r=roll<RAR.legendary.w?'legendary':roll<RAR.legendary.w+RAR.rare.w?'rare':'common';
  const own=it=>!!S.boxOwned[it[1]];

  if(!pool.length&&r==='legendary'){r='rare';pool=BOX_ITEMS.filter(it=>it[3]===r&&!own(it))}

  const th=LOCKER.theme.items.find(i=>i[0]===(themeUsable(S.look.theme)?S.look.theme:'auto'))||LOCKER.theme.items[0];
  app.innerHTML=`${ahead('Rewards')}
  <div class="card preview"><div class="pvrow">${M?emblemMaster(54):emblem(rp,54)}<div><b class="pvname" style="color:var(--r-${M?'champion':r.cls})">${M?'Master':r.full}</b><span class="pvt">${hwEsc(lookItem('title')[1])}</span><span class="fine">${th[1]} theme</span></div><img class="pvbot" src="${MASCOT}" alt=""></div></div>
  ${nu?`<div class="card nextu"><span class="clab">NEXT UNLOCK</span><b>${nu.it[2]} · ${Math.max(0,rpOfIdx(nu.i)-peakRp())} RP away</b><span class="fine">${nu.it[1]} ${({theme:'theme',accent:'accent color',title:'title',celeb:'rank-up effect'})[nu.cat]}</span></div>`:''}
  <div class="rcards">${REW_CATS.map(([k,n,d])=>`<button class="rcard" data-rcat="${k}"><b>${n}</b><span>${d}</span><small>${k==='badges'?`${BADGES.filter(b=>S.badges[b[0]]).length} of ${BADGES.filter(b=>!b[6]||S.badges[b[0]]).length} earned`:k==='box'?`${Object.keys(S.boxOwned||{}).length} of ${BOX_ITEMS.length} found${S.boxes?` · ${S.boxes} to open`:''}`:cnt(k)}</small></button>`).join('')}</div>
  ${S.teacher?'<p class="fine">Teacher view: everything is open. Each tile shows what a student needs.</p>':''}`;
}
function rewardsCat(cat){
  st.screen='rewcat';st.rcat=cat;const name=(REW_CATS.find(c=>c[0]===cat)||[])[1];
  if(cat==='badges'){
    app.innerHTML=`${ahead('Badges','rewards')}<div class="badges">${BADGES.filter(b=>!b[6]||S.badges[b[0]]).map(b=>{const on=!!S.badges[b[0]];return `<div class="badge${on?' earned':''}"><span class="bmed">${medal(b,on,44)}</span><b>${b[1]}</b><span>${b[2]}</span>${on?`<small>Earned ${String(S.badges[b[0]]).replace(/^\d{4}-/,'')}</small>`:''}</div>`}).join('')}</div>`;return}
  if(cat==='box'){
    const rk=['legendary','rare','common'];
    app.innerHTML=`${ahead('Mystery box','rewards')}<div class="card"><h2>How to earn one</h2><p class="fine">Finish all 3 daily missions on 5 school days in a row.</p>${pbar(100*(S.boxProg||0)/5,'#d99a00')}<p class="fine">${S.boxProg||0} of 5 days</p>${S.boxes?`<div class="row" style="margin-top:10px"><button class="btn" data-act="openbox">Open a box (${S.boxes})</button></div>`:''}</div>
    ${rk.map(r=>`<h2 class="sect" style="color:${RAR[r].c}">${RAR[r].n}</h2><div class="igrid">${BOX_ITEMS.filter(it=>it[3]===r).map(it=>{const own=!!(S.boxOwned||{})[it[1]]||S.teacher;return `<div class="ritem${own?'':' locked'}">${own?itemSwatch(it[0],LOCKER[it[0]].items.find(x=>x[0]===it[1])):`<span class="qsw">?</span>`}<b>${own?it[2]:'???'}</b><span class="fine">${it[0]==='title'?'Title':'Theme'}</span></div>`}).join('')}</div>`).join('')}`;return}
  const c=LOCKER[cat],items=visItems(c);let html='';
  if(cat==='theme'){const groups=[...new Set(items.map(i=>i[3]))];html=groups.map(g=>`<h2 class="sect">${g}</h2><div class="igrid">${items.filter(i=>i[3]===g).map(it=>tileOf(cat,it)).join('')}</div>`).join('')}
  else html=`<div class="igrid${cat==='title'?' wide':''}">${items.map(it=>tileOf(cat,it)).join('')}</div>`;
  app.innerHTML=`${ahead(name,'rewards')}<p class="lede">${cnt2(cat)}</p>${html}`;
}
const cnt2=cat=>{const v=visItems(LOCKER[cat]);return `${v.filter(unlocked).length} of ${v.length} unlocked. Your best rank counts, so you never lose one.`};
function tileOf(cat,it){
  const on=unlocked(it),eq=S.look[cat]===it[0];
  return `<button class="ritem${eq?' eq':''}${on?'':' locked'}" ${on?`data-eq="${cat}:${it[0]}"`:'disabled'} aria-pressed="${eq}">${itemSwatch(cat,it)}${cat==='title'?'':`<b>${it[1]}</b>`}<span class="fine">${eq?'In use':on?'Tap to use':reqLabel(it[2])}</span>${S.teacher&&it[2]?`<span class="fine tq">${reqLabel(it[2])}</span>`:''}</button>`;
}

/* ---- SETTINGS ---- */
function settingsScreen(){
  st.screen='settings';st.mode=null;const f=S.pref.font||'default';
  app.innerHTML=`${ahead('Settings')}
  <div class="card"><h2>Profile</h2><label class="fine" for="sname">First name</label><input type="text" id="sname" maxlength="30" value="${hwEsc(S.name||'')}" placeholder="Your first name" autocomplete="off"></div>
  <div class="card"><h2>Learning tools</h2><div class="toolist">${TOOLS.map(([k,n,d,df])=>`<button class="tool" data-pref="${k}" role="switch" aria-checked="${PREF(k,df)}"><span><b>${n}</b><span class="fine">${d}</span></span><i class="tgl${PREF(k,df)?' on':''}"></i></button>`).join('')}</div>
    ${speechOK?'<div class="row" style="margin-top:8px"><button class="btn ghost small" data-act="listentest">Test the voice</button></div>':'<p class="fine">Read-aloud is not supported on this device.</p>'}</div>
  <div class="card"><h2>Reading comfort</h2><div class="seg" role="group" aria-label="Font">${[['default','Normal'],['lexend','Easy read'],['dyslexic','Dyslexia-friendly']].map(([k,n])=>`<button data-font="${k}" aria-pressed="${f===k}">${n}</button>`).join('')}</div>
    <button class="tool" data-act="fspace" role="switch" aria-checked="${!!S.pref.space}"><span><b>Extra spacing</b><span class="fine">More room between letters and words.</span></span><i class="tgl${S.pref.space?' on':''}"></i></button>
    <button class="tool" data-act="snd" role="switch" aria-checked="${!!S.sound}"><span><b>Sound effects</b><span class="fine">Chimes for right answers and rank-ups.</span></span><i class="tgl${S.sound?' on':''}"></i></button></div>
  <div class="card list">
    ${rowBtn({icon:AI.rewards,t:'Theme',s:(LOCKER.theme.items.find(i=>i[0]===S.look.theme)||[0,'Auto'])[1],attr:'data-rcat="theme"'})}
    ${rowBtn({icon:AI.book,t:'Save or load my progress',s:S.lastBackup?'Last backup: '+S.lastBackup:'No backup yet',attr:'data-act="backup"'})}
    ${rowBtn({icon:AI.sun,t:"What's new",s:'See the latest updates',attr:'data-act="whatsnew"'})}
    ${rowBtn({icon:AI.settings,t:'Teacher',s:S.teacher?'Teacher mode is on':'Password needed',attr:'data-act="teacher"'})}
  </div>
  <div class="card about"><img src="${MASCOT}" alt="" width="56" height="54"><div><b>Atom Math</b><p class="fine">Everything stays on this device. Nothing is sent anywhere. Works offline.</p><p class="fine">Made by Mr. Lovrien 2026 for STEM Launch.</p></div></div>`;
  const n=document.getElementById('sname');n.addEventListener('change',()=>{S.name=n.value.trim().replace(/[^A-Za-z0-9 _-]/g,'');save();toast('Saved','up')});
}
trophies=statsScreen;locker=rewardsScreen;toolsScreen=settingsScreen;

/* ---- clicks for the new screens ---- */
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-tab-go],[data-rcat],[data-eq],[data-act="tmis"],[data-act="atomtalk"],[data-act="snd"],[data-act="whatsnew"],[data-act="tglock2"]');if(!b)return;e.stopPropagation();
  if(b.dataset.tabGo)return goTab(b.dataset.tabGo);
  if(b.dataset.rcat){rewardsCat(b.dataset.rcat);return window.scrollTo(0,0)}
  if(b.dataset.eq){const [cat,id]=b.dataset.eq.split(':');S.look[cat]=id;save();applyLook();const y=window.scrollY;rewardsCat(cat);window.scrollTo(0,y);return toast('Equipped','up')}
  const a=b.dataset.act;
  if(a==='tmis'){st.misOpen=!st.misOpen;const y=window.scrollY;home();window.scrollTo(0,y);return}
  if(a==='atomtalk'){const p=b;p.classList.remove('hop');void p.offsetWidth;p.classList.add('hop');return toast(pick(ATOM_LINES()))}
  if(a==='snd'){S.sound=!S.sound;save();sfx('good');return settingsScreen()}
  if(a==='whatsnew')return whatsNew();
  if(a==='tglock2'){st.showLocked=!st.showLocked;const y=window.scrollY;playScreen();window.scrollTo(0,y);return}
},true);
/* back buttons on old sub-screens that belonged to Settings */
(function(){
  const bs=backupScreen;backupScreen=function(){bs.apply(this,arguments);const b=app.querySelector('.back');if(b){b.removeAttribute('data-go');b.dataset.tabGo='settings';b.innerHTML=AI.back+'Settings'}};
  const ts=teacherScreen;teacherScreen=function(){ts.apply(this,arguments);const b=app.querySelector('.back');if(b&&b.dataset.go==='home'){b.removeAttribute('data-go');b.dataset.tabGo='settings';b.innerHTML=AI.back+'Settings'}};
  const rs=reportScreen;reportScreen=function(){rs.apply(this,arguments);const b=app.querySelector('.back');if(b){b.removeAttribute('data-go');b.dataset.tabGo='stats';b.innerHTML=AI.back+'Stats'}};
})();
/* the What's New list for this redesign */
WHATS.unshift(['A fresh new look','Atom Math now matches Atom: new tabs at the bottom, cleaner screens, and Atom\'s themes in Rewards.']);

/* ---- Atom Math polish: mystery back button, footer ---- */
(function(){const d=decorate;decorate=function(){d();if(st.p&&st.p.mystery){const b=app.querySelector('.back');if(b&&!b.dataset.tabGo){b.removeAttribute('data-go');b.dataset.tabGo='home';b.innerHTML=AI.back+'Home'}}}})();
/* unit lists live in Play now: "All units" goes back to Play */
(function(){const fix=()=>{const b=app.querySelector('.back');if(b&&b.dataset.go==='home'&&/All units/.test(b.textContent)){b.removeAttribute('data-go');b.dataset.tabGo='play';b.innerHTML=AI.back+'Play'}};
  const us=unitScreen;unitScreen=function(){us.apply(this,arguments);fix()};
  const ls=lockScreen;lockScreen=function(){ls.apply(this,arguments);fix()};})();

window.__G={G,gen,startRanked,genEasy,rampLevel,applyShields,parseNum,close,UNITS};
applyLook();
home();
setTimeout(checkBadges,600);
</script>

<script>try{if("serviceWorker"in navigator&&/^https?:/.test(location.protocol))addEventListener("load",function(){navigator.serviceWorker.register("launch-pad-sw.js").catch(function(){})})}catch(e){}</script>
</body>
