<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atom Math</title>
<meta name="apple-mobile-web-app-title" content="Atom Math">
<link rel="manifest" href="launch-pad-manifest.json">
<meta name="theme-color" content="#f6f4ef">
<link rel="apple-touch-icon" href="lpm-icon-192.png">
<link rel="icon" href="lpm-icon-192.png">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
</head>
<body>
<title>Atom Math</title>
<style>
/* Layout: one centered column on a graph-paper ground; three screens (units → topics → practice) swap in place */
:root{
  --paper:#f3f6fb; --grid:#e1e7f1; --ink:#14213d; --muted:#56627d; --card:#ffffff; --line:#d3dbea;
  --accent:#2f5cf5; --accent-soft:#e6ecff; --accent-ink:#ffffff; --flame:#e8670f;
  --good:#1a8a57; --good-bg:#e2f4ea; --bad:#c03a3a; --bad-bg:#fbe8e8;
  --gold:#a87a08; --gold-bg:#fbf1d6; --plat:#2f7aa3; --plat-bg:#dff0f8; --champ:#7b39c4; --champ-bg:#efe4fb;
  --r-copper:#b0502a; --r-bronze:#9c6a32; --r-silver:#7d8796; --r-gold:#c49412; --r-platinum:#1d9ea0; --r-emerald:#1c9a5c; --r-diamond:#7c4fe0; --r-champion:#d6327f;
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'Atkinson Hyperlegible','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f1626; --grid:#18223a; --ink:#e8edf8; --muted:#9aa6c2; --card:#161f33; --line:#2a3653;
  --accent:#7b9bff; --accent-soft:#1f2b4f; --accent-ink:#0b1020; --flame:#ff9a4d;
  --good:#5fd39a; --good-bg:#12301f; --bad:#ff8585; --bad-bg:#3a1717;
  --gold:#f0c34f; --gold-bg:#3a2f10; --plat:#7cc6ec; --plat-bg:#123042; --champ:#c497ff; --champ-bg:#2d1a47;
  --r-copper:#e07a4e; --r-bronze:#d19a5c; --r-silver:#b6c0cf; --r-gold:#f2c443; --r-platinum:#4fd2d0; --r-emerald:#4fd68f; --r-diamond:#a98bff; --r-champion:#ff6fb0;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f1626; --grid:#18223a; --ink:#e8edf8; --muted:#9aa6c2; --card:#161f33; --line:#2a3653;
  --accent:#7b9bff; --accent-soft:#1f2b4f; --accent-ink:#0b1020; --flame:#ff9a4d;
  --good:#5fd39a; --good-bg:#12301f; --bad:#ff8585; --bad-bg:#3a1717;
  --gold:#f0c34f; --gold-bg:#3a2f10; --plat:#7cc6ec; --plat-bg:#123042; --champ:#c497ff; --champ-bg:#2d1a47;
  --r-copper:#e07a4e; --r-bronze:#d19a5c; --r-silver:#b6c0cf; --r-gold:#f2c443; --r-platinum:#4fd2d0; --r-emerald:#4fd68f; --r-diamond:#a98bff; --r-champion:#ff6fb0;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;min-height:100vh}
#app{max-width:760px;margin:0 auto;padding:20px 16px 48px}
h1,h2{font-family:var(--display);text-wrap:balance;margin:0}
h1{font-size:clamp(28px,6vw,40px);font-weight:800;letter-spacing:-.01em;line-height:1.1}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.logo{font-family:var(--display);font-weight:800;font-size:18px;display:flex;align-items:center;gap:8px}
.logo svg{width:28px;height:28px}
.daychip{font-size:14px;color:var(--muted);text-align:right}
.daychip b{color:var(--flame);font-size:16px}
.lede{color:var(--muted);margin:8px 0 22px}
.units{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:520px){.units{grid-template-columns:1fr}}
.unit{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center;text-align:left;background:var(--card);
  border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;transition:border-color .15s,transform .15s}
.unit:hover{border-color:var(--accent);transform:translateY(-1px)}
.unit .num{grid-row:span 2;font-family:var(--display);font-weight:800;font-size:34px;color:var(--accent);width:44px;text-align:center;line-height:1}
.unit .nm{font-weight:700;line-height:1.25}
.unit .meta{font-size:14px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dots{display:inline-flex;gap:3px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.gold{background:var(--gold)}.dots i.plat{background:var(--plat)}.dots i.champ{background:var(--champ)}
.back{background:none;border:0;color:var(--muted);padding:6px 0;margin-bottom:10px;font-weight:700}
.back:hover{color:var(--accent)}
.eyebrow{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:700}
.topics{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.topic{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;background:var(--card);
  border:1.5px solid var(--line);border-radius:12px;padding:14px 16px}
.topic:hover{border-color:var(--accent)}
.topic .tn{font-weight:700}
.topic .ts{font-size:14px;color:var(--muted)}
.topic.mix{background:var(--accent-soft);border-color:transparent}
.rank{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:4px 10px;border-radius:99px;white-space:nowrap}
.rank.gold{color:var(--gold);background:var(--gold-bg)}.rank.plat{color:var(--plat);background:var(--plat-bg)}.rank.champ{color:var(--champ);background:var(--champ-bg)}
.rank.none{color:var(--muted);background:transparent;border:1px dashed var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.bar .t{min-width:0}
.bar .t .tn{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.15}
.stats{display:flex;gap:8px}
.stat{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:4px 12px;text-align:center;font-variant-numeric:tabular-nums}
.stat b{display:block;font-size:20px;line-height:1.2}
.stat span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.stat.hot b{color:var(--flame)}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:0 0 6px}
.progress div{height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.ptext{font-size:13px;color:var(--muted);margin-bottom:14px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:22px 20px}
.ask{font-size:18px;margin:0 0 12px}
.eq{font-size:clamp(22px,5vw,30px);font-weight:700;text-align:center;padding:14px 8px;margin:6px 0 14px;overflow-x:auto;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.eq + .eq{margin-top:-10px}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.8em;line-height:1.1;margin:0 2px}
.fr span:first-child{border-bottom:2px solid currentColor;padding:0 3px}
.vis{display:flex;justify-content:center;margin:4px 0 14px;overflow-x:auto}
.vis svg{max-width:100%;height:auto}
table.dt{border-collapse:collapse;font-variant-numeric:tabular-nums;margin:0 auto}
table.dt th,table.dt td{border:1.5px solid var(--line);padding:6px 14px;text-align:center}
table.dt th{background:var(--accent-soft);font-weight:700}
.answer{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:6px}
.answer input{font:inherit;font-size:22px;font-weight:700;width:9ch;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);text-align:center}
.answer input.wide{width:12ch}
.pair{font-size:26px;font-weight:700;display:flex;align-items:center;gap:6px}
.pair input{width:6ch}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:6px}
@media (max-width:520px){.choices{grid-template-columns:1fr}}
.choice{background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-weight:700;text-align:left;font-variant-numeric:tabular-nums}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice.right{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.choice.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.actions{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:12px 26px;font-weight:700;font-size:18px;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--accent);border:2px solid var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.fb{margin-top:16px;border-radius:12px;padding:12px 16px;font-weight:700}
.fb.good{background:var(--good-bg);color:var(--good)}
.fb.bad{background:var(--bad-bg);color:var(--bad)}
.fb.hint{background:var(--accent-soft);color:var(--ink);font-weight:400}
.steps{margin:10px 0 0;padding:0;list-style:none;font-weight:400;color:var(--ink)}
.steps li{padding:3px 0;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);
  padding:12px 20px;border-radius:12px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px);text-align:center}
.foot{margin-top:36px;text-align:center;font-size:13px;color:var(--muted)}

.rankcard{display:flex;align-items:center;gap:16px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px 18px;margin-bottom:22px}
.rankcard.compact{padding:10px 14px;gap:12px;margin-bottom:16px}
.rankcard .rk{flex:1;min-width:0}
.rkname{font-family:var(--display);font-weight:800;font-size:26px;text-transform:uppercase;letter-spacing:.04em;line-height:1.1}
.compact .rkname{font-size:19px}
.rkrp{font-size:14px;color:var(--muted);margin:2px 0 8px;font-variant-numeric:tabular-nums}
.rankcard .progress{margin:0}
.emblem{flex:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.18))}
.up{color:var(--good)}.down{color:var(--bad)}
.trp{font-weight:700;font-size:14px;white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
.trp.up{color:var(--good)}.trp.down{color:var(--bad)}
.rptag{display:inline-block;margin-left:6px;padding:2px 10px;border-radius:99px;background:var(--card);font-variant-numeric:tabular-nums}
.btn small{font-weight:400;opacity:.8;font-size:13px}
.toast.up{background:var(--good);color:var(--card)}.toast.down{background:var(--bad);color:var(--card)}
.toast{text-transform:uppercase;letter-spacing:.06em}

.umast{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.umast b{color:var(--ink);font-variant-numeric:tabular-nums}
.upips{display:inline-flex;gap:4px}
.upips i{width:14px;height:6px;border-radius:3px;background:var(--line)}
.upips i.on{background:var(--good)}
.wt{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--paper);color:var(--muted);border:1px solid var(--line)}
.wt.major{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.wt.mixed{color:var(--ink)}
.unit .meta{gap:6px 10px}
.unit.mastered{border-color:var(--good)}
.unit.mastered .num{color:var(--good)}
.maj{color:var(--accent)}
.mchip{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;white-space:nowrap;color:var(--muted);border:1px dashed var(--line);font-variant-numeric:tabular-nums}
.mchip.done{color:var(--good);background:var(--good-bg);border:1px solid transparent}
.cardtop{display:flex;justify-content:space-between;margin:-6px 0 6px}

.plcard{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:6px;padding:16px 18px;border-radius:14px;background:var(--card);border:2px solid var(--accent)}
.plcard.done{border-color:var(--line)}
.plcard > div{flex:1;min-width:200px}
.pltitle{font-family:var(--display);font-weight:800;font-size:19px}
.btn.small{padding:8px 18px;font-size:16px}
.plbar{margin:4px 0 6px}
.plres{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;white-space:nowrap}
.plres.done{color:var(--good);background:var(--good-bg)}
.plres.close{color:var(--gold);background:var(--gold-bg)}
.plres.need{color:var(--bad);background:var(--bad-bg)}

.brand{flex-wrap:wrap}
.hbtns{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.streakbtn{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:6px 12px;font-weight:800;font-size:15px;border:1.5px solid var(--flame);background:var(--card);color:var(--flame);font-variant-numeric:tabular-nums}
.streakbtn svg{width:18px;height:18px}
.streakbtn span{font-size:13px;text-transform:uppercase;letter-spacing:.05em}
.streakbtn.todo{background:var(--flame);color:var(--card);animation:wpulse 2.2s ease-in-out infinite}
@keyframes wpulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--flame) 45%,transparent)}50%{box-shadow:0 0 0 7px transparent}}
.runres.warmdone{border-color:var(--flame)}
@media (max-width:480px){.iconbtn[data-act="locker"] span{display:none}}
.flamebig{color:var(--flame)}.flamebig svg{width:56px;height:56px}
.warmdone .verdict{color:var(--flame)}
@media (prefers-reduced-motion:reduce){.streakbtn.todo{animation:none}}
.iconbtn{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:6px 10px;font-weight:700;font-size:14px;color:var(--ink)}
.iconbtn svg{width:20px;height:20px}
.iconbtn:hover{border-color:var(--accent)}
.missions{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px 18px;margin:-8px 0 26px;display:flex;flex-direction:column;gap:12px}
.mhead{display:flex;justify-content:space-between;align-items:baseline;gap:4px 10px;flex-wrap:wrap}
.mhead .ts{font-size:13px;color:var(--muted)}
.mrow{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:center}
.mcheck{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:var(--card)}
.mcheck svg{width:15px;height:15px}
.mrow.done .mcheck{background:var(--good);border-color:var(--good)}
.mtxt{font-weight:700;font-size:15px}
.mrow.done .mtxt{color:var(--muted)}
.mbar{display:block;height:6px;background:var(--line);border-radius:99px;margin-top:5px;overflow:hidden}
.mbar i{display:block;height:100%;background:var(--flame);border-radius:99px}
.mrow.done .mbar i{background:var(--good)}
.mrp{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:4px 0 12px}
@media (max-width:520px){.modes{grid-template-columns:1fr}}
.mode{display:flex;gap:12px;align-items:center;text-align:left;border:0;border-radius:14px;padding:14px 16px;color:var(--accent-ink);transition:transform .15s,filter .15s}
.mode.rapid{background:var(--accent)}
.mode.surv{background:var(--bad)}
.mode:hover{filter:brightness(1.07);transform:translateY(-1px)}
.micon svg{width:34px;height:34px;display:block}
.mname{display:block;font-family:var(--display);font-weight:800;font-size:20px;line-height:1.2}
.mdesc{display:block;font-size:14px;opacity:.92}
.mbest{display:inline-block;margin-top:6px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;border:1.5px solid currentColor;padding:1px 8px;border-radius:99px}
.stat svg{width:16px;height:16px;vertical-align:-2px;margin-right:1px}
.stat.fire{border-color:var(--flame)}
.stat.fire b{color:var(--flame)}
.combo{display:inline-flex;align-items:center;gap:3px;margin-left:8px;color:var(--flame);font-weight:800}
.combo svg{width:18px;height:18px}
.step1{margin-top:8px}
.arena-top{display:flex;align-items:center;gap:10px;margin:6px 0 10px;flex-wrap:wrap}
.arena-top .stats{margin-left:auto}
.timer{font-family:var(--display);font-weight:800;font-size:38px;line-height:1;font-variant-numeric:tabular-nums;min-width:2.6ch}
.tbar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:14px}
.tbar div{height:100%;background:var(--accent);border-radius:99px}
.tbar.low div{background:var(--bad)}
.hearts{display:flex;gap:4px;color:var(--bad)}
.hearts svg{width:32px;height:32px;display:block}
.hearts .lost{color:var(--line)}
.card{transition:border-color .15s,box-shadow .15s}
.card.flashgood{border-color:var(--good);box-shadow:0 0 0 4px var(--good-bg)}
.count{text-align:center;padding-block:48px}
.cnum{font-family:var(--display);font-weight:800;font-size:128px;line-height:1;color:var(--accent);margin:10px 0;animation:pop .6s ease-out}
@keyframes pop{from{transform:scale(1.6);opacity:0}to{transform:scale(1);opacity:1}}
.runres{text-align:center;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:24px 16px;margin:6px 0 16px}
.bigscore{font-family:var(--display);font-weight:800;font-size:96px;line-height:1;margin:8px 0 4px;font-variant-numeric:tabular-nums}
.runres .ts{color:var(--muted)}
.newbest{display:inline-block;margin-top:12px;background:var(--flame);color:var(--card);font-weight:800;padding:4px 14px;border-radius:99px;text-transform:uppercase;letter-spacing:.06em;font-size:14px}
.runrp{margin-top:12px}
#overlay{position:fixed;inset:0;background:rgba(8,12,24,.72);display:grid;place-items:center;z-index:50;padding:16px}
.ovbox{position:relative;background:var(--card);border-radius:20px;padding:28px 24px;text-align:center;width:min(360px,100%);overflow:hidden}
#overlay[hidden],.toast[hidden]{display:none}
#confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.ovkick{position:relative;font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.16em;color:var(--muted)}
.ovemb{position:relative;margin:12px 0 4px;animation:pop .6s ease-out}
.ovemb .emblem{width:132px;height:132px}
.ovrank{position:relative;font-family:var(--display);font-weight:800;font-size:32px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:18px}
.ovbox .btn{position:relative}
.toast{z-index:60;width:max-content}
.h2{font-size:22px;margin:28px 0 12px}
.tstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px}
@media (max-width:520px){.tstats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tstat{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center}
.tstat b{display:block;font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums}
.tstat span{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.badge{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 10px;text-align:center}
.badge:not(.on) .bname{color:var(--muted)}
.bname{font-weight:700;font-size:14px;margin-top:2px}
.bdesc{font-size:12px;color:var(--muted)}

.rktitle{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-top:1px}
/* backgrounds (Locker) */
.pat-graph{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
.pat-plain{background-image:none}
.pat-dots{background-image:radial-gradient(var(--line) 1.6px,transparent 2px);background-size:20px 20px}
.pat-diag{background-image:repeating-linear-gradient(45deg,var(--grid) 0 2px,transparent 2px 16px);background-size:auto}

.pat-bigGrid{background-image:linear-gradient(var(--line) 1.5px,transparent 1.5px),linear-gradient(90deg,var(--line) 1.5px,transparent 1.5px);background-size:64px 64px}
.pat-rings{background-image:radial-gradient(circle,transparent 0 9px,var(--grid) 9px 11px,transparent 11px);background-size:34px 34px}
.pat-hexes{background-image:radial-gradient(circle at 50% 0,transparent 0 12px,var(--grid) 12px 14px,transparent 14px),radial-gradient(circle at 0 50%,transparent 0 12px,var(--grid) 12px 14px,transparent 14px),radial-gradient(circle at 100% 50%,transparent 0 12px,var(--grid) 12px 14px,transparent 14px);background-size:48px 28px}
.pat-ruled{background-image:linear-gradient(90deg,transparent 38px,color-mix(in srgb,var(--bad) 40%,transparent) 38px 40px,transparent 40px),repeating-linear-gradient(0deg,transparent 0 27px,var(--line) 27px 28px)}
.pat-fracbg{background-image:linear-gradient(var(--grid) 2px,transparent 2px),linear-gradient(90deg,var(--grid) 2px,transparent 2px);background-size:50% 50%;background-size:60px 60px}
.pat-galaxy{background-image:radial-gradient(circle at 20% 20%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 45%),radial-gradient(circle at 80% 70%,color-mix(in srgb,var(--r-champion) 18%,transparent),transparent 45%),radial-gradient(var(--muted) 1px,transparent 1.5px),radial-gradient(var(--accent) 1.2px,transparent 1.8px);background-size:auto,auto,41px 47px,73px 79px;background-position:0 0,0 0,7px 11px,23px 5px;background-attachment:fixed,fixed,scroll,scroll}
.ban-grid{background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:16px 16px}
.ban-chevron{background-image:linear-gradient(135deg,color-mix(in srgb,var(--accent) 14%,transparent) 25%,transparent 25%),linear-gradient(225deg,color-mix(in srgb,var(--accent) 14%,transparent) 25%,transparent 25%);background-size:24px 24px}
.ban-dotsb{background-image:radial-gradient(color-mix(in srgb,var(--accent) 22%,transparent) 5px,transparent 6px);background-size:22px 22px}
.ban-ribbon{background-image:linear-gradient(100deg,transparent 0 30%,color-mix(in srgb,var(--accent) 18%,transparent) 30% 42%,transparent 42% 50%,color-mix(in srgb,var(--flame) 18%,transparent) 50% 58%,transparent 58%)}
.ban-galaxyb{background-image:radial-gradient(circle at 15% 30%,color-mix(in srgb,var(--accent) 30%,transparent),transparent 50%),radial-gradient(circle at 85% 80%,color-mix(in srgb,var(--r-champion) 28%,transparent),transparent 50%),radial-gradient(var(--muted) 1px,transparent 1.5px);background-size:auto,auto,26px 31px}
.ban-flame{background-image:linear-gradient(0deg,color-mix(in srgb,var(--flame) 32%,transparent),transparent 70%);border-color:var(--flame)}
:root[data-cards="dashed"] :is(.unit,.topic,.card,.rankcard,.missions,.plcard){border-style:dashed;border-width:2px}
:root[data-cards="shadow"] :is(.unit,.topic,.card,.rankcard,.missions,.plcard,.mode,.runres){box-shadow:5px 5px 0 var(--line);border-color:var(--ink)}
:root[data-cards="gold"] :is(.unit,.topic,.card,.rankcard,.missions,.plcard){border-color:var(--r-gold);border-width:2.5px;box-shadow:0 0 0 1px color-mix(in srgb,var(--r-gold) 40%,transparent)}
:root[data-cards="retro"] :is(.unit,.topic,.card,.rankcard,.missions,.plcard,.mode,.runres,.btn,.choice){border-radius:0;border:2.5px solid var(--ink);box-shadow:4px 4px 0 var(--ink)}
.tq{display:flex;align-items:center;gap:5px;justify-content:center;margin-top:4px;padding-top:4px;border-top:1px dashed var(--line);color:var(--accent);font-weight:700}
.tnote{background:var(--accent-soft);border:1.5px solid var(--accent);border-radius:12px;padding:10px 14px;margin:12px 0;font-size:15px}

.sw.scn{background-image:var(--scene);background-size:cover;background-position:center bottom;background-repeat:no-repeat}
body.scene{background-image:none!important;--op:.85}
body.scene.sdark{--op:.42}
body.scene::before{content:"";position:fixed;left:0;right:0;top:0;bottom:0;z-index:-1;pointer-events:none;background-image:var(--scene);background-size:cover;background-position:center bottom;background-repeat:no-repeat;opacity:var(--op)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body.scene{--op:.25}:root:not([data-theme="light"]) body.scene.sdark{--op:.8}}
:root[data-theme="dark"] body.scene{--op:.25}:root[data-theme="dark"] body.scene.sdark{--op:.8}
.pat-galaxy{background-attachment:scroll!important}
/* ===== POLISH ===== */
:root{--r-card:20px;--r-btn:14px;--sh-soft:0 1px 2px rgba(20,33,61,.06),0 6px 18px rgba(20,33,61,.07)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--sh-soft:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.28)}}
:root[data-theme="dark"]{--sh-soft:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.28)}
body{font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1{font-size:clamp(26px,6vw,34px);letter-spacing:-.02em}
.h2,h2{font-size:21px;letter-spacing:-.01em}
.lede{font-size:16px;line-height:1.45;margin:6px 0 18px;max-width:52ch}
p{text-wrap:pretty}
.eyebrow{font-size:12px;letter-spacing:.1em;font-weight:800}
/* chunky buttons */
.btn{border-radius:var(--r-btn);padding:13px 28px;font-weight:800;letter-spacing:.01em;box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 62%,#000);transition:transform .08s,box-shadow .08s,filter .15s}
.btn:hover:not(:disabled){filter:brightness(1.06)}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 62%,#000)}
.btn.ghost{background:var(--card);box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 35%,var(--line))}
.btn.ghost:active:not(:disabled){box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 35%,var(--line))}
.btn.small{padding:8px 18px;font-size:15px;box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 62%,#000)}
.btn svg,.back svg{width:1em;height:1em;vertical-align:-.12em;margin:0 .2em;flex:none}
.back{display:inline-flex;align-items:center;gap:2px;font-weight:800;font-size:15px}
.back svg{margin:0 2px 0 -4px;width:20px;height:20px}
/* cards */
.card,.rankcard,.missions,.plcard,.runres{border-radius:var(--r-card);box-shadow:var(--sh-soft)}
.card{padding:24px 22px}
.ask{font-size:19px;line-height:1.45}
.unit,.topic,.mode,.tool,.rkn,.mistrow{box-shadow:0 3px 0 var(--line)}
.topic,.unit{border-width:2px;border-radius:16px}
.topic:active,.unit:active,.mode:active,.choice:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.choice{border-width:2px;border-radius:14px;padding:14px 16px;box-shadow:0 3px 0 var(--line);transition:transform .08s,box-shadow .08s,border-color .15s;font-size:18px}
.choice.right{box-shadow:0 3px 0 color-mix(in srgb,var(--good) 55%,transparent);animation:pop .35s}
.choice.wrong{box-shadow:0 3px 0 color-mix(in srgb,var(--bad) 55%,transparent);animation:shake .4s}
.answer input{border-width:3px;border-radius:14px;font-size:24px;box-shadow:inset 0 2px 0 rgba(0,0,0,.04);transition:border-color .15s,box-shadow .15s}
.answer input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);outline:none}
.fb{border-radius:14px;animation:rise .28s both}
.stat{border-radius:12px;box-shadow:0 2px 0 var(--line)}
.mode{border-radius:18px;box-shadow:0 5px 0 rgba(0,0,0,.22)}
.mode:active{box-shadow:0 1px 0 rgba(0,0,0,.22);transform:translateY(4px)}
/* progress */
.progress{height:12px;background:color-mix(in srgb,var(--line) 80%,transparent)}
.progress div{position:relative;transform-origin:left;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
.progress div::after{content:"";position:absolute;left:6px;right:6px;top:2px;height:3px;border-radius:2px;background:rgba(255,255,255,.35)}
/* motion */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.96)}55%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
#app>*{animation:rise .35s both}
#app>*:nth-child(2){animation-delay:.04s}#app>*:nth-child(3){animation-delay:.08s}#app>*:nth-child(4){animation-delay:.12s}#app>*:nth-child(5){animation-delay:.16s}#app>*:nth-child(n+6){animation-delay:.2s}
.units .unit{animation:rise .4s both}
.units .unit:nth-child(2){animation-delay:.05s}.units .unit:nth-child(3){animation-delay:.1s}.units .unit:nth-child(4){animation-delay:.15s}.units .unit:nth-child(n+5){animation-delay:.2s}
.emblem{animation:bob 3.2s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* header */
.brand{margin-bottom:16px}
.hbtns{flex-wrap:nowrap;gap:6px}
.iconbtn{border-radius:12px;padding:7px 9px;box-shadow:0 2px 0 var(--line)}
.iconbtn span{display:none}
.iconbtn[data-act="trophies"] span{display:inline}
.streakbtn{border-radius:12px;padding:7px 11px;box-shadow:0 2px 0 color-mix(in srgb,var(--flame) 45%,transparent)}
.streakbtn.todo span{display:none}
@media (min-width:560px){.streakbtn.todo span{display:inline}}
.tchip{display:inline-block;padding:4px 8px;font-size:10px}
/* hero rank card */
.rankcard:not(.compact){padding:18px 20px;margin-bottom:14px;background-color:var(--card)}
.rankcard:not(.compact) .rkname{font-size:28px}
.cta{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;text-align:left;border:0;border-radius:18px;padding:16px 20px;margin:0 0 14px;background:var(--accent);color:var(--accent-ink);box-shadow:0 5px 0 color-mix(in srgb,var(--accent) 62%,#000);transition:transform .08s,box-shadow .08s}
.cta:active{transform:translateY(4px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 62%,#000)}
.cta b{display:block;font:800 20px var(--display)}
.cta small{display:block;font-size:14px;opacity:.85;font-weight:600}
.cta svg{width:30px;height:30px;flex:none}
.eyebrow.qp{margin:6px 0 8px}
.modes{margin-bottom:6px}
/* unit tiles */
.h1u{margin-top:22px}
.units{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:12px}
@media (min-width:640px){.units{grid-template-columns:repeat(3,minmax(0,1fr))!important}}
.unit{grid-template-columns:1fr;justify-items:center;text-align:center;gap:8px;padding:16px 12px 14px;position:relative}
.unit .num{grid-row:auto;width:56px;height:56px;border-radius:18px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:26px}
.unit .num svg{width:30px;height:30px}
.unit .unum{position:absolute;top:10px;left:12px;font:800 13px var(--display);color:var(--muted)}
.unit .nm{font-size:15px;font-weight:800;line-height:1.2;min-height:2.4em;display:grid;place-items:center}
.unit .meta{justify-content:center;font-size:12.5px;gap:4px 6px}
.ubar{display:block;width:100%;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.ubar b{display:block;height:100%;background:var(--good);border-radius:99px;transform-origin:left;animation:grow .8s both}
.unit.mastered{border-color:var(--good)}
.unit.mastered .num{background:var(--good-bg);color:var(--good)}
.unit.locked{opacity:.65;background:color-mix(in srgb,var(--card) 70%,var(--paper))}
.unit.locked .num{background:var(--line);color:var(--muted)}
.unit.locked .nm{font-size:14px}
/* missions collapsed */
.missions{margin:14px 0 14px;gap:10px}
.missions .mhead{cursor:pointer;align-items:center;flex-wrap:nowrap}
.missions .mhead::after{content:"";width:10px;height:10px;border-right:3px solid var(--muted);border-bottom:3px solid var(--muted);transform:rotate(45deg);margin:-4px 4px 0 0;transition:transform .2s;flex:none}
.missions.col .mhead::after{transform:rotate(-45deg);margin-top:0}
.missions.col .mrow{display:none}
.missions .mhead{gap:8px}.missions .mhead .ts{margin-left:auto;text-align:right}
.mistrow{margin:0 0 14px}
.actions .linkbtn{font-weight:700}
.missions .pltitle{white-space:nowrap;font-weight:800}
.unit.locked .nm{min-height:0}
.modes{margin:12px 0}

.ban-halloween_m4{background-image:linear-gradient(110deg,color-mix(in srgb,#e8670f 30%,transparent),transparent 55%,color-mix(in srgb,#6b2fb8 30%,transparent));}
.ban-halloween_s4{background-image:repeating-radial-gradient(circle at 100% 0,transparent 0 14px,color-mix(in srgb,#8b8fa8 28%,transparent) 14px 15.5px),conic-gradient(from 180deg at 100% 0,transparent 0 10deg,color-mix(in srgb,#8b8fa8 28%,transparent) 10deg 11.5deg,transparent 11.5deg 24deg);}
.ban-thanksgiving_m4{background-image:repeating-conic-gradient(from 0deg at 90% 20%,color-mix(in srgb,#e8890f 24%,transparent) 0 8deg,transparent 8deg 16deg);}
.ban-thanksgiving_s4{background-image:repeating-linear-gradient(0deg,transparent 0 14px,color-mix(in srgb,#b4350a 22%,transparent) 14px 22px),repeating-linear-gradient(90deg,transparent 0 14px,color-mix(in srgb,#e8890f 22%,transparent) 14px 22px);background-size:28px 28px;}
.ban-winter_m4{background-image:linear-gradient(180deg,color-mix(in srgb,#38bdf8 28%,transparent),transparent 60%),radial-gradient(color-mix(in srgb,#fff 70%,transparent) 2px,transparent 3px);}
.ban-winter_s4{background-image:repeating-linear-gradient(-45deg,color-mix(in srgb,#dc2626 24%,transparent) 0 12px,color-mix(in srgb,#16a34a 20%,transparent) 12px 24px);}
.ban-piday_m4{background-image:repeating-linear-gradient(45deg,transparent 0 9px,color-mix(in srgb,#c9852f 24%,transparent) 9px 11px),repeating-linear-gradient(-45deg,transparent 0 9px,color-mix(in srgb,#c9852f 24%,transparent) 9px 11px);}
.ban-piday_s4{background-image:radial-gradient(circle,transparent 0 10px,color-mix(in srgb,#c9852f 28%,transparent) 10px 12px,transparent 12px);background-size:22px 22px;}
.ban-spring_m4{background-image:radial-gradient(color-mix(in srgb,#e0559a 30%,transparent) 4px,transparent 5px);background-size:22px 22px;}
.ban-spring_s4{background-image:repeating-conic-gradient(from 0deg at 90% 20%,color-mix(in srgb,#facc15 24%,transparent) 0 8deg,transparent 8deg 16deg);}
.season{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;border-radius:18px;padding:14px 18px;margin:0 0 14px;color:#fff;background:linear-gradient(120deg,var(--sc),var(--sc2));box-shadow:0 5px 0 rgba(0,0,0,.28);transition:transform .08s,box-shadow .08s}
.season:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
.season.soon{filter:saturate(.8)}
.season .semoji{font-size:34px;line-height:1;flex:none}
.season .sbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.season b{font:800 18px var(--display)}
.season small{font-size:13.5px;font-weight:600;opacity:.95}
.season>svg{width:24px;height:24px;flex:none}
.strack{position:relative;display:block;height:12px;border-radius:99px;background:rgba(0,0,0,.3);margin-top:6px}
.strack i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:#fff;opacity:.95}
.strack u{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -14px;border-radius:50%;background:rgba(0,0,0,.45);border:2px solid #fff;text-decoration:none}
.strack u.on{background:#ffd84d}
.shero{display:flex;align-items:center;gap:14px;border-radius:20px;padding:18px 20px;margin:6px 0 14px;color:#fff;background:linear-gradient(120deg,var(--sc),var(--sc2));box-shadow:0 5px 0 rgba(0,0,0,.28)}
.shero h1{color:#fff;font-size:26px;text-shadow:0 1px 2px rgba(0,0,0,.3)}.shero .ts{color:#fff;opacity:.92;font-weight:600}
.semoji.big{font-size:46px;line-height:1}
.sprog{margin:0 0 18px}
.stiers{display:flex;flex-direction:column;gap:10px;margin:10px 0}
.stier{display:grid;grid-template-columns:96px 1fr auto;gap:14px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 14px;box-shadow:0 3px 0 var(--line)}
.stier .stsw .sw{height:44px}
.stier.next{border-color:var(--accent)}
.stier:not(.got) .stsw{opacity:.55;filter:grayscale(.5)}
.stier .sti b{display:block}
.stchk{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:800 13px var(--display);background:var(--paper);color:var(--muted);border:2px solid var(--line)}
.stier.got .stchk{background:var(--good);border-color:var(--good);color:#fff}
.stchk svg{width:16px;height:16px}
/* readable text on any background */
h1,.h2,h2,.lede,.eyebrow,.ptext,.back,.ts,.foot,.linkbtn{text-shadow:0 0 6px var(--paper),0 0 2px var(--paper)}
.card .ts,.unit .ts,.topic .ts,.stier .ts,.tool .ts,.bk .ts,.season small,.shero .ts{text-shadow:none}
.foot{display:table;margin:36px auto 0;padding:5px 14px;border-radius:99px;background:color-mix(in srgb,var(--paper) 82%,transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:var(--ink);opacity:.8}
.actions .linkbtn{background:color-mix(in srgb,var(--paper) 82%,transparent);border-radius:99px;padding:6px 14px;color:var(--ink)}
.eyebrow,.lede,.back{background:none}
body.scene .lede,body.scene .eyebrow{background:color-mix(in srgb,var(--paper) 70%,transparent);display:inline-block;padding:2px 10px;border-radius:10px}
.fchip{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--flame);border-radius:99px;padding:3px 12px;margin-bottom:8px}

/* ---- home: game-mode row + missions/mistakes row ---- */
.modes3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:4px 0 14px}
.mode.mode3{flex-direction:column;justify-content:center;text-align:center;gap:4px;padding:14px 8px;min-height:132px;width:100%;font:inherit}
.mode3 .micon svg{width:34px;height:34px;margin:0 auto}
.mode3 .mname{font-size:clamp(15px,4.4vw,19px)}
.mode3 .mdesc{font-size:clamp(12px,3.3vw,14px)}
.mode3 .mbest{margin-top:2px;font-size:11px}
.mode.rank{background:var(--r-gold,#e0a800);color:#1d1600}
.mode.rank.locked{background:var(--card);color:var(--muted);border:2px dashed var(--line);box-shadow:none;cursor:default}
.mode3 .mname,.mode3 .mdesc{text-transform:none;letter-spacing:0}
.mode.rank.locked:hover{transform:none;filter:none}
.toprow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0 4px}
.tile{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;font:inherit;box-shadow:0 3px 0 var(--line);min-width:0}
.tile .tt{font:800 15px var(--display)}
.tile .tn{font:800 26px var(--display);line-height:1}
.tile .ts{font-size:12.5px;color:var(--muted)}
.tile.mis{border-color:var(--bad)}
.tile.clear .tn{color:var(--good,#2e9d57)}
.tile .pips{display:flex;gap:5px;margin-top:2px}
.tile .pips i{flex:1;height:7px;border-radius:9px;background:var(--line)}
.tile .pips i.on{background:var(--accent)}
.tile .btn{align-self:flex-start;margin-top:4px}
.toprow+.missions{margin:6px 0 4px}
.toprow~.missions.col{display:none}
.cal{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px;margin:6px 0 12px}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cw{text-align:center;font-size:11px;font-weight:700;color:var(--muted)}
.cd{display:flex;flex-direction:column;align-items:center;justify-content:center;aspect-ratio:1;border-radius:8px;font-style:normal;background:transparent;border:1px solid var(--line);color:var(--ink);line-height:1}
.cd b{font-size:12px;font-weight:700}.cd u{text-decoration:none;font-size:10px;min-height:10px}
.cd.empty{border:0}.cd.fut{opacity:.35}.cd.off{background:repeating-linear-gradient(45deg,transparent 0 4px,var(--line) 4px 5px)}

:root[data-theme="noir"]{--bg:#0d0d0d;--surface:#171717;--ink:#f2f2f2;--muted:#9a9a9a;--line:#2c2c2c;--accent:#e11d2e;--btn:#f2f2f2;--btn-ink:#0d0d0d;color-scheme:dark}
:root[data-theme="synthwave"]{--bg:#1a0b2e;--surface:#26104a;--ink:#ffe9ff;--muted:#c18ae0;--line:#4a1f7a;--accent:#00e5ff;--btn:#ffe9ff;--btn-ink:#1a0b2e;color-scheme:dark}
:root[data-theme="matcha"]{--bg:#e4ead2;--surface:#f0f4e2;--ink:#27301a;--muted:#6b7a4a;--line:#c9d3a8;--accent:#4c7a1a;--btn:#27301a;--btn-ink:#f0f4e2;color-scheme:light}
:root[data-theme="bubblegum"]{--bg:#ffd6f0;--surface:#ffeaf8;--ink:#3a0f35;--muted:#9a4a8a;--line:#f6aee0;--accent:#0aa6c2;--btn:#3a0f35;--btn-ink:#ffeaf8;color-scheme:light}
/* map the app's older names onto Atom's tokens */
:root{--paper:var(--bg)!important;--card:var(--surface)!important;--grid:transparent!important;--accent-soft:color-mix(in srgb,var(--accent) 12%,var(--surface))!important;--accent-ink:var(--bg)!important;
  --display:Georgia,"Iowan Old Style","Times New Roman",serif!important;--body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif!important;
  --good-bg:color-mix(in srgb,var(--good) 13%,var(--surface))!important;--bad-bg:color-mix(in srgb,var(--bad) 12%,var(--surface))!important;
  --sh-card:0 1px 2px rgba(0,0,0,.04),0 8px 20px -10px rgba(0,0,0,.14);--sh-btn:0 1px 1px rgba(0,0,0,.04),0 3px 8px -2px rgba(0,0,0,.10)}
html{background:var(--bg)}
html body{background-color:transparent!important;background-image:none;color:var(--ink);font:16px/1.5 var(--body);-webkit-tap-highlight-color:transparent}
:root[data-theme] body,:root:not([data-theme]) body{background-color:transparent!important}
body::before,body::after{display:none!important}
html body *{box-shadow:none!important;text-shadow:none!important}
#app{max-width:760px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px 28px;display:flex;flex-direction:column;gap:14px}
body[data-tab]:not([data-tab=""]) #app{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
#app>*{margin-top:0!important;margin-bottom:0!important}
#app>*{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
#app>*:nth-child(2){animation-delay:.03s}#app>*:nth-child(3){animation-delay:.06s}#app>*:nth-child(4){animation-delay:.09s}#app>*:nth-child(5){animation-delay:.12s}#app>*:nth-child(n+6){animation-delay:.15s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){#app>*{animation:none!important}}

/* type */
#app h1{font:600 26px/1.2 var(--display);letter-spacing:0;margin:0;color:var(--ink);text-transform:none}
#app h2,#app .h2{font:600 16px/1.3 var(--body);margin:0;color:var(--ink);letter-spacing:0;text-transform:none}
#app .sect{font:600 13px/1.3 var(--body);color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin:6px 0 -4px!important}
#app .lede{margin:0;color:var(--muted);font-size:15px}
#app .fine,#app .ts{color:var(--muted);font-size:13px;margin:0}
#app .eyebrow{font:600 12px/1.3 var(--body);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.clab{font:700 10px/1.2 var(--body);letter-spacing:.12em;color:var(--muted)}

/* buttons: Atom pills */
#app button,#app .btn,#overlay button{font-family:var(--body)}
#app .btn,#overlay .btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 15px var(--body);padding:10px 18px;border-radius:999px!important;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;box-shadow:var(--sh-btn)!important;text-transform:none;letter-spacing:0;transition:transform .12s}
#app .btn:not(.ghost),#overlay .btn:not(.ghost){background:var(--btn)!important;color:var(--btn-ink)!important;border-color:var(--btn)!important;box-shadow:0 5px 14px -4px color-mix(in srgb,var(--btn) 50%,transparent)!important}
#app .btn.ghost,#overlay .btn.ghost{background:var(--surface)!important;color:var(--ink)!important;border:1px solid var(--line)!important}
#app .btn.small{min-height:36px;padding:6px 14px;font-size:14px}
#app .btn:active{transform:scale(.97)}
#app .btn:disabled{opacity:.45;cursor:default}
#app .back{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;gap:4px;min-height:40px;padding:0 10px 0 2px;margin-left:-4px!important;color:var(--muted);font:600 14px var(--body);cursor:pointer;border-radius:999px;align-self:flex-start}
#app .back svg{width:20px;height:20px}
#app .back:hover{color:var(--ink)}
.linkb,#app .linkbtn{all:unset;cursor:pointer;color:var(--muted);font:600 14px var(--body);text-decoration:underline;text-underline-offset:3px;align-self:center;padding:6px}
input[type=text],input[type=number],input[type=password],select,textarea,.bkin,.bkcode,.answer input,.pair input{border:1px solid var(--line)!important;border-radius:12px!important;background:var(--surface)!important;color:var(--ink)!important;font:16px/1.4 var(--body)!important;padding:10px 14px!important}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent)!important;outline-offset:1px}
#app input[type=text]{width:100%;box-sizing:border-box}

/* cards */
#app .card,#app .tile,.bk,.rankcard,.missions,.runres,.plcard,.tstat,.wkcard,.cal,.wbars,.sheet-card{background:var(--surface)!important;border:1px solid var(--line)!important;border-radius:18px!important;box-shadow:var(--sh-card)!important}
#app .card{padding:14px;display:block}
#app .card>h2+*{margin-top:8px}
#app .card>h2+.plot{margin-top:30px}
.pbar{display:block;height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:3px;transform-origin:left;animation:grow .8s cubic-bezier(.2,.8,.2,1) both}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.flame{color:#f08a24;display:inline-block;vertical-align:-2px;margin-right:3px}

/* tab bar */
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:none;justify-content:center;gap:4px;padding:6px 8px max(8px,env(safe-area-inset-bottom));background:color-mix(in srgb,var(--surface) 86%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line)}
body[data-tab]:not([data-tab=""]) #tabbar{display:flex}
#tabbar button{all:unset;box-sizing:border-box;flex:1;max-width:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font:600 11px var(--body);padding:6px 2px;min-height:52px;border-radius:14px;cursor:pointer}
#tabbar button.on{color:var(--accent)}
#tabbar button.on svg{transform:translateY(-1px) scale(1.08)}
#tabbar button:focus-visible{outline:2px solid var(--accent)}
.toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))!important;background:var(--btn)!important;color:var(--btn-ink)!important;border-radius:999px!important;font:500 14px var(--body)!important;text-transform:none!important;letter-spacing:0!important;padding:10px 18px!important;box-shadow:0 8px 24px -8px rgba(0,0,0,.4)!important;max-width:90vw;text-align:center}
.toast.up,.toast.down{background:var(--btn)!important;color:var(--btn-ink)!important}

/* headers */
.ahead{display:flex;align-items:center;gap:8px;min-height:44px}
.ahead .ah1{flex:1;min-width:0}
.ahead.home{justify-content:space-between}
#app .abrand{font:600 30px/1.1 var(--display);margin:0;flex:1}
#app .abrand span{color:var(--accent)}
.hright{display:flex;align-items:center;gap:8px}
.iconb{all:unset;box-sizing:border-box;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;box-shadow:var(--sh-btn)!important;flex:none}
#app .tchip{all:unset;cursor:pointer;font:700 11px var(--body);letter-spacing:.06em;text-transform:uppercase;padding:6px 10px;border-radius:999px;background:var(--btn);color:var(--btn-ink)}
.peek{all:unset;cursor:pointer;position:relative;display:block;line-height:0}
.peek img{width:44px;height:auto;transition:transform .2s}
.peek.mood-excited img{animation:botb 1.6s ease-in-out infinite}
.peek.mood-sleepy img{filter:saturate(.6) brightness(.9);transform:rotate(-8deg)}
.peek.mood-sad img{filter:grayscale(.6);transform:rotate(10deg) translateY(2px)}
.peek.hop img{animation:hop .5s ease}
.peek .zz{position:absolute;left:-4px;top:-4px;font:800 13px var(--display);color:var(--muted);animation:zz 2.4s ease-in-out infinite}
@keyframes hop{40%{transform:translateY(-8px) rotate(-6deg)}}
@keyframes botb{50%{transform:translateY(-4px) rotate(-3deg)}}

/* home */
.arank{all:unset;box-sizing:border-box;display:grid;gap:4px;width:100%;cursor:pointer;margin-top:-6px!important}
.arank .ark{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.arank .arkl{display:flex;align-items:center;gap:7px}
.arank .arkl svg{width:22px;height:22px}
.arank b{font:700 14px var(--body);letter-spacing:.04em;text-transform:uppercase}
.arank .pbar{margin:0}
.greetrow{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.greet{margin:0;font:600 21px/1.25 var(--display)}
.titleline{margin:2px 0 0;font-size:13px;color:var(--muted)}
.minis{display:flex;gap:6px;flex:none}
.mini{all:unset;box-sizing:border-box;cursor:pointer;width:84px;display:grid;gap:3px;text-align:left;padding:6px 8px;border:1px solid var(--line);border-top:3px solid var(--sc,var(--accent));border-radius:10px;background:var(--surface)}
.mini .mt{display:flex;align-items:center;gap:4px;min-width:0}
.mini .mt i{font-style:normal;font-size:12px;line-height:1}
.mini .mt .flame{margin:0;width:14px;height:14px}
.mini b{font:700 11px/1.1 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .ms{font-size:10px;line-height:1.15;color:var(--muted)}
.mini .pbar{height:5px;margin:0}
.mini .pips{display:flex;gap:3px}.mini .pips i{flex:1;height:5px;border-radius:3px;background:var(--line)}.mini .pips i.on{background:var(--sc)}
#app .actbtn{width:100%;justify-content:space-between;min-height:58px;padding:10px 20px;text-align:left;border-radius:999px}
.actbtn span{display:grid;gap:1px}.actbtn b{font:600 16px var(--body)}.actbtn small{font-size:13px;opacity:.75}
.incard{all:unset;box-sizing:border-box;cursor:pointer;display:grid!important;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:12px 14px!important}
.incard b{font:600 15px var(--body);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.incard .clab{color:var(--accent)}
.incard svg{color:var(--muted)}
#app .card.nudge{display:flex!important;align-items:center;gap:10px;padding:10px 14px}
.nudge .grow{flex:1;display:grid}
.card.list{padding:4px 0!important}
.lrow{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line)}
.card.list>.lrow:first-child{border-top:0}
.lrow:disabled{cursor:default;opacity:.6}
.lrow:hover:not(:disabled){background:color-mix(in srgb,var(--ink) 4%,transparent)}
.lic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 12%,var(--surface));color:var(--accent)}
.lic svg{width:20px;height:20px}.lic .flame{margin:0;width:18px;height:18px}
.lic.fl{background:color-mix(in srgb,#f08a24 14%,var(--surface));color:#f08a24}

const UNITS = [
  {n:1,  name:'Solving Equations', topics:[

  {n:8,  name:'Irrational Numbers & Pythagoras', topics:[
    ['roots','Square & cube roots'],['estRoot','Estimate square roots'],['ratIrr','Rational or irrational'],
    ['hyp','Find the hypotenuse'],['leg','Find a missing leg'],['dist','Distance on a coordinate plane'],['converse','Is it a right triangle?'],['pythWord','Pythagorean word problems']]},

/* Unit order follows the class pacing guide: 5 Functions, 6 Systems, 7 Data, 8 Exponents, 9 Pythagoras, 10 Volume. */
(function(){const m={5:6,6:5,7:8,8:9,9:10,10:7};UNITS.forEach(u=>{if(m[u.n])u.n=m[u.n]});UNITS.sort((a,b)=>a.n-b.n)})();

/* ---------- helpers ---------- */
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const rnz=(a,b)=>{let v;do v=ri(a,b);while(v===0);return v};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=ri(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const N=n=>n<0?'−'+(-n):''+n;                       // display number with real minus sign
const P=n=>n<0?'('+N(n)+')':N(n);                    // parenthesize negatives
const plus=n=>n===0?'':(n<0?' − '+(-n):' + '+n);     // " + 4" / " − 4"

const deg='°';

/* ---------- SVG visuals ---------- */

  if(lines.length){const cid='c'+Math.random().toString(36).slice(2,8);g+=`<clipPath id="${cid}"><rect x="${X(-R)}" y="${Y(R)}" width="${X(R)-X(-R)}" height="${Y(-R)-Y(R)}"/></clipPath>`;
    lines.forEach((L,i)=>{g+=`<line clip-path="url(#${cid})" x1="${X(-R)}" y1="${Y(L.m*-R+L.b)}" x2="${X(R)}" y2="${Y(L.m*R+L.b)}" stroke="${i?'var(--flame)':'var(--accent)'}" stroke-width="2.5"${i?' stroke-dasharray="7 4"':''}/>`;
      if(L.label){for(let t=R-1;t>-R;t--){const yy=L.m*t+L.b;if(Math.abs(yy)<R-1){g+=`<text x="${X(t)-4}" y="${Y(yy)-8}" font-size="12" font-weight="700" text-anchor="end" fill="var(--ink)">${L.label}</text>`;break}}}});}

}
function scatter(points,xl,yl){
  const W=300,H=210,L=36,B=30,xs=points.map(p=>p[0]),ys=points.map(p=>p[1]);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const X=x=>L+10+(x-x0)/(x1-x0||1)*(W-L-24),Y=y=>H-B-10-(y-y0)/(y1-y0||1)*(H-B-24);
  let g=`<line x1="${L}" y1="${H-B}" x2="${W-6}" y2="${H-B}" stroke="var(--ink)" stroke-width="1.5"/><line x1="${L}" y1="8" x2="${L}" y2="${H-B}" stroke="var(--ink)" stroke-width="1.5"/>`;
  g+=`<text x="${(L+W)/2}" y="${H-8}" font-size="12" text-anchor="middle" fill="var(--muted)">${xl}</text><text x="12" y="${(H-B)/2}" font-size="12" text-anchor="middle" fill="var(--muted)" transform="rotate(-90 12 ${(H-B)/2})">${yl}</text>`;
  for(const p of points)g+=`<circle cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="4.5" fill="var(--accent)"/>`;

}

const G = {};
const SOLVE='Solve for x.';

/* Unit 1 */
G.oneStep=()=>{const x=rnz(-12,12),t=pick(['add','mul','div']);
  if(t==='add'){const a=rnz(-15,15),b=x+a;return{solve:[[1,a],[0,b]],ask:SOLVE,eq:`x${plus(a)} = ${N(b)}`,a:x,
    hint:`${a>0?'Subtract':'Add'} ${Math.abs(a)} on both sides.`,steps:[`x${plus(a)} = ${N(b)}`,`x = ${N(b)} ${a>0?'−':'+'} ${Math.abs(a)}`,`x = ${N(x)}`]}}
  if(t==='mul'){const a=pick([1,-1])*ri(2,9),b=a*x;return{solve:[[a,0],[0,b]],ask:SOLVE,eq:`${tm(a)} = ${N(b)}`,a:x,
    hint:`Divide both sides by ${N(a)}.`,steps:[`${tm(a)} = ${N(b)}`,`x = ${N(b)} ÷ ${P(a)}`,`x = ${N(x)}`]}}
  const a=ri(2,8),b=rnz(-10,10),xx=a*b;return{solve:[[1/a,0],[0,b]],ask:SOLVE,eq:`${fr('x',a)} = ${N(b)}`,a:xx,
    hint:`Multiply both sides by ${a}.`,steps:[`x ÷ ${a} = ${N(b)}`,`x = ${N(b)} × ${a}`,`x = ${N(xx)}`]};
};
G.twoStep=()=>{const x=rnz(-10,10),a=pick([1,-1])*ri(2,9),b=rnz(-15,15),c=a*x+b;

    steps:[`${tm(a)}${plus(b)} = ${N(c)}`,`${tm(a)} = ${N(c-b)}`,`x = ${N(c-b)} ÷ ${P(a)} = ${N(x)}`]}};
G.distrib=()=>{const a=pick([1,-1])*ri(2,6),b=rnz(-9,9),x=rnz(-8,8),c=a*(x+b);
  return{solve:[[a,a*b],[0,c],{start:[`${N(a)}(x${plus(b)})`,N(c)],pre:[wNote(`Distribute ${N(a)}`,wEx(a,a*b),N(c))]}],ask:SOLVE,eq:`${N(a)}(x${plus(b)}) = ${N(c)}`,a:x,hint:`Distribute ${N(a)} to both terms inside the parentheses.`,
    steps:[`${N(a)}(x${plus(b)}) = ${N(c)}`,`${tm(a)}${plus(a*b)} = ${N(c)}`,`${tm(a)} = ${N(c-a*b)}`,`x = ${N(x)}`]}};
G.bothSides=()=>{const x=rnz(-8,8);let a,c;do{a=rnz(-9,9);c=rnz(-9,9)}while(a===c);const b=rnz(-12,12),d=a*x+b-c*x;
  return{solve:[[a,b],[c,d]],ask:SOLVE,eq:`${tm(a)}${plus(b)} = ${tm(c)}${plus(d)}`,a:x,hint:`Get all the x terms on one side first. Try ${c>0?'subtracting':'adding'} ${tm(Math.abs(c))} on both sides.`,
    steps:[`${tm(a)}${plus(b)} = ${tm(c)}${plus(d)}`,`${tm(a-c)}${plus(b)} = ${N(d)}`,`${tm(a-c)} = ${N(d-b)}`,`x = ${N(x)}`]}};
G.rational=()=>{const q=pick([2,3,4,5,6]);let p;do p=ri(1,q+2);while(gcd(p,q)!==1||p===q);const x=q*rnz(-6,6),b=rnz(-10,10),c=p*x/q+b;
  return{solve:[[p/q,b],[0,c]],ask:SOLVE,eq:`${fr(p,q)}x${plus(b)} = ${N(c)}`,a:x,hint:`Undo the ${N(b)} first. Then multiply by the reciprocal, ${fr(q,p)}.`,
    steps:[`${p}/${q} x = ${N(c-b)}`,`x = ${N(c-b)} × ${q}/${p}`,`x = ${N(x)}`]}};
G.numSol=()=>{const a=ri(2,7),b=rnz(-6,6),kind=ri(0,2),L=`${N(a)}(x${plus(b)})`;let R,ans;
  if(kind===0){let c;do c=rnz(-9,9);while(c===a);R=`${tm(c)}${plus(rnz(-12,12))}`;ans='One solution'}
  else if(kind===1){R=`${tm(a)}${plus(a*b+rnz(-5,5))}`;ans='No solution'}

    hint:'Distribute, then compare. Different x-coefficients → one solution. Same x-coefficients: same constant → infinitely many, different constant → none.',
    steps:[`Left side: ${tm(a)}${plus(a*b)}`,`Right side: ${R}`,ans]})};

/* Unit 2 */
const ptName=()=>pick(['A','B','C','P','Q']);

    vis:plane([{x,y,label:n}]),a:[x+dx,y+dy],hint:`Right/left changes x. Up/down changes y.`,steps:[`x: ${N(x)}${plus(dx)} = ${N(x+dx)}`,`y: ${N(y)}${plus(dy)} = ${N(y+dy)}`,`${n}′(${N(x+dx)}, ${N(y+dy)})`]}};

G.similar=()=>{const w=ri(2,8),h=ri(2,9),k=pick([2,3,4,1.5]);if(k===1.5&&(w%2||h%2))return null;const W=w*k,H=h*k,shape=pick(['rectangle','triangle']);

/* Unit 3 */
G.triSum=()=>{const a=ri(25,100),b=ri(20,160-a),c=180-a-b;if(c<10)return null;

G.checkSol=()=>{const sx=ri(-5,5),sy=ri(-5,5);let m1,m2;do{m1=rnz(-4,4);m2=rnz(-4,4)}while(m1===m2);const b1=sy-m1*sx,b2=sy-m2*sx;

G.sysNum=()=>{const m=rnz(-5,5),b=rnz(-8,8),kind=ri(0,2),k=ri(2,3);let e2,ans;

G.isFunc=()=>{const xs=shuffle([-3,-2,-1,0,1,2,3,4]).slice(0,4),pts=xs.map(x=>[x,ri(-6,6)]),no=Math.random()<.5;

function vol(kind,r,h,usePi,dia){
  const coefPi=kind==='cyl'?r*r*h:kind==='cone'?r*r*h/3:4*r**3/3;
  const f=kind==='cyl'?'V = πr²h':kind==='cone'?'V = ⅓πr²h':'V = ⁴⁄₃πr³';
  const dims=kind==='sphere'?(dia?`diameter ${2*r} cm`:`radius ${r} cm`):(dia?`diameter ${2*r} cm and height ${h} cm`:`radius ${r} cm and height ${h} cm`);
  const name={cyl:'cylinder',cone:'cone',sphere:'sphere'}[kind];
  if(usePi)return{ask:`Find the volume of a ${name} with ${dims}. Answer in terms of π. Enter just the number in front of π.`,a:coefPi,show:showNum(coefPi)+'π',
    hint:`${f}${dia?'. Remember: radius is half the diameter.':''}`,steps:[f,`r = ${r}${kind!=='sphere'?`, h = ${h}`:''}`,`V = ${showNum(coefPi)}π cm³`]};
  const v=coefPi*3.14;return{ask:`Find the volume of a ${name} with ${dims}. Use 3.14 for π. Round to the nearest tenth.`,a:v,tol:Math.max(.06,v*.006),show:(+v.toFixed(1))+'',
    hint:`${f}${dia?'. Remember: radius is half the diameter.':''}`,steps:[f,`V = ${showNum(coefPi)} × 3.14 ≈ ${v.toFixed(1)} cm³`]};
}

/* ======================================================================
   INVERSE-OPERATION WORK — equation solutions shown the way they're written on the board.
   Each inverse operation sits directly under the term it cancels:
     −6 + x = −18          3x + 4 = 10
     +6       +6               −4   −4
     ──────────            ──────────
          x = −12              3x = 6   (then a fraction bar with 3 under each side)
   A generator adds solve:[[xCoef,const],[xCoef,const],{start,pre,mode}] and gen() builds p.work.
   Sides are token lists: {k:'x'|'c'|'s'(sign)|'all', h:html}.
   ====================================================================== */
const wR=v=>Math.round(v*1e9)/1e9;
function wFrac(v){for(let d=2;d<=12;d++){const n=v*d;if(Math.abs(n-Math.round(n))<1e-6)return [Math.round(n),d]}return null}
function wNf(v,mode){v=wR(v);if(Number.isInteger(v))return N(v);if(mode==='dec')return dec(v);const f=wFrac(v);return f?fracHTML(f[0],f[1]):dec(v)}
function wXt(c,mode){c=wR(c);if(c===1)return 'x';if(c===-1)return '−x';if(Number.isInteger(c)||mode==='dec')return wNf(c,mode)+'x';
  const f=wFrac(Math.abs(c));if(!f)return dec(c)+'x';return (c<0?'−':'')+(f[0]===1?fr('x',f[1]):fr(f[0]+'x',f[1]))}
function wSide(terms,mode){
  const t=terms.filter(([c])=>wR(c)!==0);if(!t.length)return [{k:'c',h:'0'}];
  const out=[];
  t.forEach(([c,isX],i)=>{c=wR(c);const neg=c<0,m=Math.abs(c),h=isX?wXt(m,mode):wNf(m,mode),k=isX?'x':'c';
    if(i===0)out.push({k,h:(neg?'−':'')+h});else{out.push({k:'s',h:neg?'−':'+'});out.push({k,h})}});
  return out;
}
const wS=(...t)=>wSide(t.map(([c,x])=>[c,!!x]));
const wEx=(c,k,mode)=>wSide([[c,1],[k,0]],mode);
function wOp(v,isX,mode){v=wR(v);const a=Math.abs(v),s=v>0?'−':'+';return s+(isX?(a===1?'x':wNf(a,mode)+'x'):wNf(a,mode))}
const wNote=(note,l,r)=>({kind:'note',note,to:[l,r]});
const wMul=(a,l,r)=>({kind:'mul',m:String(a),to:[l,r]});
function solveWork(L,R,o={}){
  const mode=o.mode,flip=wR(L[0])===0,X=(flip?R:L).slice(),K=(flip?L:R).slice(),moves=[...(o.pre||[])];
  const st0=o.start&&o.start[flip?1:0],cFirst=Array.isArray(st0)&&st0[0]&&st0[0].k==='c'&&st0.some(t=>t.k==='x');
  const put=(xs,ks)=>flip?[ks,xs]:[xs,ks],side=(c,k)=>wSide(cFirst?[[k,0],[c,1]]:[[c,1],[k,0]],mode);
  let mi=0,errKind=null;const bad=k=>{if(o.err===mi++){errKind=k;return true}return false};
  if(wR(K[0])!==0){const t=wOp(K[0],true,mode);X[0]-=K[0];if(bad('x'))X[0]+=2*K[0];K[0]=0;if(wR(X[0])===0)throw new Error('degenerate');moves.push({kind:'op',tg:'x',l:t,r:t,to:put(side(X[0],X[1]),side(0,K[1]))})}
  if(wR(X[1])!==0){const t=wOp(X[1],false,mode);K[1]-=X[1];if(bad('c'))K[1]+=2*X[1];X[1]=0;moves.push({kind:'op',tg:'c',l:t,r:t,to:put(side(X[0],0),side(0,K[1]))})}
  const c=wR(X[0]);let ans=K[1]/c;
  if(c!==1){
    if(Number.isInteger(c)||mode==='dec'){if(bad('div'))ans=-ans}else if(bad('mul'))ans=K[1]*c;
    if(Number.isInteger(c)||mode==='dec')moves.push({kind:'div',d:wNf(c,mode),to:put(side(1,0),side(0,ans))});
    else{const f=wFrac(Math.abs(c)),m=(c<0?'(−':'')+(f[0]===1?f[1]:fr(f[1],f[0]))+(c<0?')':'');moves.push({kind:'mul',m,to:put(side(1,0),side(0,ans))})}
  }
  return{start:o.start||[side(L[0],L[1]),side(R[0],R[1])],moves,ans,errKind};
}
const wToks=s=>typeof s!=='string'?s:[{k:/^[−-]?\d+(\.\d+)?$/.test(s)?'c':'all',h:s}];
const wSideH=toks=>wToks(toks).map(t=>`<span class="tk">${t.h}</span>`).join('');
function wOpSide(toks,tg,op,left){
  toks=wToks(toks);const i=tg==='all'?-1:toks.findIndex(t=>t.k===tg);
  if(tg==='all')return `<span class="tk"><span class="gh">${wSideH(toks)}</span><span class="opl">${op}</span></span>`;
  if(i<0){const g=`<span class="gh">${wSideH(toks)}</span>`,o=`<span class="tk opx">${op}</span>`;return left?o+g:g+o}
  return toks.map((t,j)=>`<span class="tk"><span class="gh">${t.h}</span>${j===i?`<span class="opl">${op}</span>`:''}</span>`).join('');
}
function workHTML(w,n=Infinity,num=false){
  let si=0;const X4=num?'<td></td>':'',CS=num?4:3;
  const row=(l,r,lab)=>`<tr><td>${wSideH(l)}</td><td>=</td><td>${wSideH(r)}</td>${num?`<td>${lab?`<span class="wst">Step ${lab}</span>`:''}</td>`:''}</tr>`;let prev=w.start,h=row(prev[0],prev[1]);
  for(const mv of w.moves.slice(0,n)){si++;
    if(mv.kind==='op')h+=`<tr class="wop"><td>${wOpSide(prev[0],mv.tg,mv.l,true)}</td><td></td><td>${wOpSide(prev[1],mv.tg,mv.r,false)}</td>${X4}</tr><tr class="wrule"><td colspan="${CS}"></td></tr>`;
    else if(mv.kind==='div'){const b=s=>`<span class="dvb"><span class="gh2">${wSideH(s)}</span><span class="dvn">${mv.d}</span></span>`;h+=`<tr class="wdiv"><td>${b(prev[0])}</td><td></td><td>${b(prev[1])}</td>${X4}</tr><tr class="wrule"><td colspan="${CS}"></td></tr>`}
    else if(mv.kind==='mul')h+=`<tr class="wmul"><td><span class="mulf">${mv.m}</span>(${wSideH(prev[0])})</td><td>=</td><td>(${wSideH(prev[1])})<span class="mulf">${mv.m}</span></td>${X4}</tr><tr class="wrule"><td colspan="${CS}"></td></tr>`;
    else h+=`<tr class="wnote"><td colspan="${CS}">↓ ${mv.note}</td></tr>`;
    h+=row(mv.to[0],mv.to[1],si);prev=mv.to;

}

function gen(id){for(let i=0;i<50;i++){const p=G[id]();if(p){if(p.solve){try{p.work=solveWork(...p.solve)}catch(e){}}

    else if(FIXGEN[id]){for(let k=0;k<10;k++){const q=FIXGEN[id]();if(q){q.topic=id;return q}}}}p.type=p.type||'num';p.topic=id;if(p.show==null)p.show=p.type==='pair'?`(${N(p.a[0])}, ${N(p.a[1])})`:p.type==='choice'?p.a:showNum(p.a);return p}}}

function parseNum(s){
  s=String(s).replace(/[−–]/g,'-').replace(/\s+/g,'').replace(/,/g,'').replace(/^[a-zA-Z]+=/,'').replace(/%$/,'').replace(/π$/,'');
  if(!s)return null;
  const m=s.match(/^(-?\d*\.?\d+)\/(-?\d*\.?\d+)$/);if(m){const d=+m[2];return d?+m[1]/d:null}
  const v=Number(s);return Number.isFinite(v)?v:null;
}

function newProblem(){
  if(st.mode==='mist'){const id=st.mq.q[st.mq.i];st.unit=unitOfTopic(id).n;st.p=gen(id);st.tries=0;st.done=false;st.hintLevel=0;st.autoSpeak=true;practice();return}
  if(st.mode==='warm'){const id=st.warm.topics[st.warm.i];st.unit=unitOfTopic(id).n;st.p=gen(id);st.tries=0;st.done=false;st.hintLevel=0;st.autoSpeak=true;practice();return}
  if((st.mode==='rapid'||st.mode==='surv')&&st.run&&st.run.mix)st.unit=mixUnit();
  const u=UNITS.find(x=>x.n===st.unit),game=st.mode==='rapid'||st.mode==='surv';
  const id=st.mode==='placement'?S.placing.queue[S.placing.i]:st.mode==='test'?S.testing.queue[S.testing.i]:(game||st.topic==='mix')?pick(u.topics)[0]:st.topic;
  st.p=focusMaybe()||(st.mode===null?genEasy(id):gen(id));st.t0=Date.now();st.fast=false;st.tries=0;st.done=false;st.hintLevel=0;if(!game)st.autoSpeak=true;game?arena():practice();
}

    if(st.done){const last=S.testing.i>=S.testing.queue.length-1;a.innerHTML=`<button class="btn" data-act="tnext" id="nextBtn">${last?'See results →':'Next question →'}</button>`;focusNext()}
    else a.innerHTML=st.p.type!=='choice'?'<button class="btn" data-act="check">Check</button>':'';
    return}
  if(st.mode==='placement'){
    if(st.done){const last=S.placing.i>=S.placing.queue.length-1;a.innerHTML=`<button class="btn" data-act="plnext" id="nextBtn">${last?'See results →':'Next match →'}</button>`;focusNext()}
    else a.innerHTML=st.p.type!=='choice'?'<button class="btn" data-act="check">Check</button>':'';
    return}
  if(st.done){a.innerHTML=st.mode==='mist'?`<button class="btn" data-act="mnext" id="nextBtn">${st.mq.i>=st.mq.q.length-1?'Finish →':'Next mistake →'}</button>`:`<button class="btn" data-act="next" id="nextBtn">Next problem →</button>`;focusNext();return}
  const p=st.p,w=weightOf(p.topic);let hb='';
  if(!st.hintLevel)hb=`<button class="btn ghost" data-act="hint">Hint <small>(earns less RP)</small></button>`;
  else if(st.hintLevel===1&&firstStep(p))hb=`<button class="btn ghost" data-act="hint">Show first step <small>(earns even less)</small></button>`;
  a.innerHTML=`${p.type!=='choice'?'<button class="btn" data-act="check">Check</button>':''}${hb}`;
}
function feedback(kind,html){document.getElementById('fb').innerHTML=`<div class="fb ${kind}">${html}</div>`;decorate()}
const firstStep=p=>p.work?(p.work.moves.length?[1]:null):p.steps.length>=3?p.steps.slice(0,2):p.steps.length===2?[p.steps[0]]:null;
function showHint(){st.hintLevel++;const p=st.p,fs=st.hintLevel>=2&&firstStep(p);
  feedback('hint',`<b>Hint:</b> ${p.hint}${fs?`<div class="step1"><b>First step:</b>${p.work?workHTML(p.work,1):`<ul class="steps">${fs.map(x=>`<li>${x}</li>`).join('')}</ul>`}</div>`:''}`);renderActions()}
const stepsHTML=p=>p.fixRight?`<div>${p.steps[0]} Here is the correct work:</div><ol class="steps fixok">${p.fixRight.map(x=>`<li>${x}</li>`).join('')}</ol>`:p.fix?`<div>${p.steps[0]} Here is the correct work:</div>${workHTML(p.work)}`:p.work?workHTML(p.work):`<ul class="steps">${p.steps.map(s=>`<li>${s}</li>`).join('')}</ul>`;
const rpTag=d=>`<span class="rptag ${d>=0?'up':'down'}">${signed(d)} RP</span>`;

/* Each problem is one "match": first-try win, second-try win, or loss.
   Wins are multiplied by the topic's CMAS weight. Losses are a flat 15. */
function record(topic,firstTry){const t=T(topic);t.recent.push(firstTry);if(t.recent.length>MASTER_WINDOW)t.recent.shift();
  if(t.flag&&t.recent.length>=MASTER_WINDOW&&recentRight(topic)>=MASTER_NEED){t.flag=false;const nm=UNITS.flatMap(u=>u.topics).find(x=>x[0]===topic);toast(`Review done · ${nm?nm[1]:''}`,'up')}}
function applyRP(delta,topic){
  const prev=rpNow(),before=rankInfo(prev);let next=Math.max(START_RP,prev+delta),capped=false;
  if(!allPassed()&&next>=CHAMP_I_RP){next=Math.max(prev,CHAMP_I_RP-1);capped=delta>0}
  const peakBefore=rankIdx(peakRp());S.rp=next;const d=S.rp-prev;S.peak=Math.max(S.peak||0,S.rp);
  const fresh=unlocksBetween(peakBefore,rankIdx(S.peak));if(fresh.length)st.newUnlocks=(st.newUnlocks||[]).concat(fresh);
  if(topic){const t=T(topic);t.rp=(t.rp||0)+d}st.sess.rp+=d;save();
  const after=rankInfo(S.rp);
  if(after.full!==before.full){if(d>0)celebrate();else toast(`Deranked · ${after.full}`,'down')}
  else if(capped&&!st.capWarned){st.capWarned=true;toast('Champion I is locked · Pass all 10 unit tests','')}
  return d;
}
function grade(correct,choiceBtn){
  if(st.p&&st.p.focus&&st.mode!=='ranked')return gradeFocus(correct,choiceBtn);
  if(st.mode==='ranked')return gradeRanked(correct,choiceBtn);
  if(st.mode==='placement')return gradePlacement(correct,choiceBtn);
  if(st.mode==='warm')return gradeWarm(correct,choiceBtn);
  if(st.mode==='lesson')return gradeLesson(correct,choiceBtn);
  if(st.mode==='test')return gradeTest(correct,choiceBtn);
  if(st.mode==='rapid')return gradeRapid(correct,choiceBtn);
  if(st.mode==='surv')return gradeSurv(correct,choiceBtn);
  const p=st.p,t=T(p.topic),w=weightOf(p.topic);st.tries++;
  if(correct){
    const wasMastered=topicMastered(p.topic),unitWas=unitMastered(UNITS.find(x=>x.n===st.unit)),allWas=allMastered();
    if(st.tries===1){st.sess.missRun=0;t.c++;t.t++;st.sess.c++;st.sess.t++;noteCorrect(p.topic,!st.hintLevel)}
    if(st.mode==='mist'&&st.tries===1&&!st.hintLevel&&clearMistake(p.topic)){st.mq.fixed++;toast('Mistake fixed','up')}
    record(p.topic,st.tries===1&&!st.hintLevel);
    const base=st.tries>1?RP_SECOND:st.hintLevel>=2?RP_STEP_WIN:st.hintLevel?RP_HINT_WIN:RP_WIN+RP_STREAK*Math.min(st.sess.streak,RP_STREAK_CAP);
    if(st.tries===1){st.sess.streak++;S.stats.streakBest=Math.max(S.stats.streakBest,st.sess.streak);const dd=D();dd.streakBest=Math.max(dd.streakBest,st.sess.streak)}
    t.best=Math.max(t.best,st.sess.streak);
    st.done=true;const d=applyRP(Math.round(base*w),p.topic);sfx('good');
    practice();if(choiceBtn!=null)markChoices(choiceBtn);
    const combo=st.tries===1&&st.sess.streak>=3?`<span class="combo">${ICON.flame}${st.sess.streak} in a row</span>`:'';
    feedback('good',`${st.tries===1?pick(['Correct!','Nice work!','You got it!','Exactly right.']):'Correct on the second try.'} ${d?rpTag(d):''}${combo}`);
    const u=UNITS.find(x=>x.n===st.unit);
    if(!allWas&&allMastered())toast('All 10 units mastered','up');
    else if(!unitWas&&unitMastered(u))toast(`Unit ${u.n} mastered`,'up');
    else if(!wasMastered&&topicMastered(p.topic))toast(`Topic mastered · ${u.topics.find(x=>x[0]===p.topic)[1]}`,'up');
    checkMissions();return;
  }
  if(st.tries===1){if(Date.now()-(st.t0||0)<3000)st.fast=true;st.sess.t++;t.t++;st.sess.streak=0;st.sess.missRun=(st.sess.missRun||0)+1;record(p.topic,false);addMistake(p.topic);save()}
  sfx('bad');
  if(st.tries>=2||p.type==='choice'&&p.choices.length===2){
    st.done=true;const d=applyRP(p.ramp===0?0:st.fast?-2*RP_LOSS:-RP_LOSS,p.topic);practice();if(choiceBtn!=null)markChoices(choiceBtn);
    feedback('bad',`${d?rpTag(d):''}${p.ramp===0?'<div class="ts">No RP lost. This is a warm start.</div>':st.fast?'<div class="ts"><b>Too fast.</b> Quick misses cost double. Slow down and read.</div>':''} The answer is ${p.show}. Here's how:${stepsHTML(p)}${st.sess.missRun>=2&&st.mode===null?`<div class="helpoffer"><button class="lbtn" data-learn="${p.topic}">${ICON.book}Need help? Open the lesson</button></div>`:''}`);return;
  }
  if(choiceBtn!=null){const b=document.querySelector(`[data-choice="${choiceBtn}"]`);b.classList.add('wrong');b.disabled=true}
  feedback('bad',`Not quite. Try once more. ${p.ramp===0?'No RP lost on a warm start.':st.fast?`That was fast. Slow down and read. A miss now costs ${2*RP_LOSS} RP.`:`A miss costs ${RP_LOSS} RP.`}${st.hintLevel?'':' Tap Hint if you are stuck.'}`);
  const i=document.getElementById('a1');if(i){i.select();i.focus()}
}
function markChoices(picked){
  document.querySelectorAll('.choice').forEach(b=>{const c=st.p.choices[+b.dataset.choice];if(c===st.p.a)b.classList.add('right');else if(+b.dataset.choice===+picked)b.classList.add('wrong')});
}
function check(){
  const p=st.p;if(st.done)return;
  if(p.type==='num'){const v=parseNum(document.getElementById('a1').value);if(v==null){feedback('hint','Type a number first. Fractions like 3/4 work too.');return}grade(close(v,p.a,p))}
  else if(p.type==='pair'){const x=parseNum(document.getElementById('a1').value),y=parseNum(document.getElementById('a2').value);
    if(x==null||y==null){feedback('hint','Fill in both the x and y boxes.');return}grade(close(x,p.a[0],p)&&close(y,p.a[1],p))}
}

/* ======================================================================
   PLACEMENT MATCHES — once per unit. 3 problems per topic, shuffled, one try, no hints.
   3/3 on a topic → placed out (counts as mastered). Results seed the topic's mastery record.
   Correct answers earn weighted RP (no streak bonus). Misses cost nothing.
   ====================================================================== */
const PLACE_PER_TOPIC=3, PLACE_WIN=20;
function placementStatus(n){return (S.placed||{})[n]}
function placementCard(u){
  const done=placementStatus(u.n),going=S.placing&&S.placing.unit===u.n;
  if(done){const ids=u.topics.map(x=>x[0]),out=ids.filter(id=>done.score[id]===PLACE_PER_TOPIC).length;
    return `<div class="plcard done"><div><div class="pltitle">Placement complete</div><div class="ts">Placed out of ${out} of ${ids.length} topics · ${signed(done.rp)} RP</div></div>
    <button class="btn ghost small" data-act="plresults">Results</button></div>`}
  const n=u.topics.length*PLACE_PER_TOPIC;
  if(going)return `<div class="plcard"><div><div class="pltitle">Placement in progress</div><div class="ts">Match ${S.placing.i+1} of ${n}</div></div><button class="btn small" data-act="place">Resume</button></div>`;
  if(S.placing)return `<div class="plcard"><div><div class="pltitle">Placement matches</div><div class="ts">Finish your Unit ${S.placing.unit} placement first.</div></div></div>`;
  return `<div class="plcard"><div><div class="pltitle">Placement matches</div><div class="ts">${n} problems, ${PLACE_PER_TOPIC} per topic. Get all ${PLACE_PER_TOPIC} right to place out of a topic. One try per unit.</div></div><button class="btn small" data-act="place">Start</button></div>`;
}
function startPlacement(){
  const u=UNITS.find(x=>x.n===st.unit);
  if(!S.placing||S.placing.unit!==u.n){
    const q=[];u.topics.forEach(([id])=>{for(let k=0;k<PLACE_PER_TOPIC;k++)q.push(id)});
    let sh;for(let k=0;k<20;k++){sh=shuffle(q);if(sh.every((x,i)=>i===0||x!==sh[i-1]))break}
    S.placing={unit:u.n,queue:sh,i:0,res:{},rp:0};save();
  }
  st.mode='placement';st.screen='practice';newProblem();window.scrollTo(0,0);
}
function gradePlacement(correct,choiceBtn){
  const p=st.p,pl=S.placing;if(st.done)return;st.tries=1;st.done=true;
  (pl.res[p.topic]=pl.res[p.topic]||[]).push(!!correct);
  let d=0;if(correct){d=applyRP(Math.round(PLACE_WIN*weightOf(p.topic)),p.topic);pl.rp+=d;const t=T(p.topic);t.c++;t.t++;noteCorrect(p.topic,true);sfx('good')}else{T(p.topic).t++;addMistake(p.topic);sfx('bad')}
  save();practice();if(choiceBtn!=null)markChoices(choiceBtn);
  if(correct)feedback('good',`Correct! ${d?rpTag(d):''}`);
  else feedback('bad',`The answer is ${p.show}.`);
}
function nextPlacement(){
  const pl=S.placing;pl.i++;save();
  if(pl.i<pl.queue.length){newProblem();return}
  const u=UNITS.find(x=>x.n===pl.unit),score={};
  for(const [id] of u.topics){const r=pl.res[id]||[],t=T(id);score[id]=r.filter(Boolean).length;
    t.recent=t.recent.concat(r).slice(-MASTER_WINDOW);if(score[id]===PLACE_PER_TOPIC)t.placed=true}
  S.placed=S.placed||{};S.placed[u.n]={score,rp:pl.rp,date:today()};S.placing=null;st.mode=null;save();
  if(allMastered())toast('All 10 units mastered','up');
  else if(unitMastered(u))toast(`Unit ${u.n} mastered`,'up');
  placementResults();checkMissions();
}
function placementResults(){
  const u=UNITS.find(x=>x.n===st.unit),r=placementStatus(u.n);st.screen='results';
  const label=s=>s===PLACE_PER_TOPIC?['Placed out','done']:s===PLACE_PER_TOPIC-1?['Almost there','close']:['Needs practice','need'];
  app.innerHTML=`<button class="back" data-go="unit">← Unit ${u.n} topics</button><div class="eyebrow">Unit ${u.n} · Placement results</div><h1>${u.name}</h1>
  <p class="lede">${signed(r.rp)} RP earned. Topics you placed out of count as mastered.</p>${rankBlock(true)}
  <div class="topics">${u.topics.map(([id,nm])=>{const s=r.score[id]??0,[t,c]=label(s);return `<button class="topic" data-topic="${id}"><span><span class="tn">${nm}</span><br><span class="ts">${s}/${PLACE_PER_TOPIC} correct</span></span><span class="plres ${c}">${t}</span></button>`}).join('')}</div>
  <div class="actions"><button class="btn" data-go="unit">Back to topics</button></div>${foot}`;
  window.scrollTo(0,0);
}

let actx;
function sfx(kind){
  if(!S.sound)return;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const seq={good:[[660,.07],[880,.12]],bad:[[196,.2]],rank:[[523,.1],[659,.1],[784,.1],[1047,.3]],mission:[[784,.08],[1047,.14]],badge:[[880,.07],[1175,.07],[1568,.16]],tick:[[1200,.04]],end:[[523,.12],[392,.22]]}[kind]||[];
    let t=actx.currentTime;
    for(const [f,d] of seq){const o=actx.createOscillator(),g=actx.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d+.02);t+=d*.9}
  }catch(e){}

function D(){if(!S.daily||S.daily.date!==today())S.daily={date:today(),correct:0,streakBest:0,rapidBest:0,survBest:0,major:0,units:[],clean:0,done:[]};return S.daily}
function noteCorrect(topic,clean){const d=D();d.correct++;if(isMajor(topic))d.major++;if(st.unit>=1&&!d.units.includes(st.unit))d.units.push(st.unit);if(clean)d.clean++;if(st.unit>=1&&st.unit<=7)d.early=(d.early||0)+1;S.days[today()]=(S.days[today()]||0)+1}
const MISSIONS=[
  {id:'major',txt:'Get 10 right on core skills',goal:10,val:d=>d.major||0},
  {id:'correct',txt:'Get 15 answers right',goal:15,val:d=>d.correct},
  {id:'streak',txt:'Hit a 5-answer streak',goal:5,val:d=>d.streakBest},
  {id:'rapid',txt:'Score 12+ in one Quick Play',goal:12,val:d=>d.rapidBest},
  {id:'surv',txt:'Reach 8 in one Last Stand run',goal:8,val:d=>d.survBest},

const missionRP=m=>m.id==='major'?Math.round(MISSION_RP*MAJOR_W):MISSION_RP;
function todaysMissions(){ // the CMAS major mission every day + 2 others picked by the date
  let h=7;for(const c of today())h=(h*31+c.charCodeAt(0))>>>0;
  const pool=MISSIONS.slice(1),out=[MISSIONS[0]];
  while(out.length<3){h=(h*1103515245+12345)>>>0;out.push(pool.splice(h%pool.length,1)[0])}
  return out;
}
function checkMissions(){
  const d=D();let n=0;
  for(const m of todaysMissions()){if(d.done.includes(m.id)||m.val(d)<m.goal)continue;d.done.push(m.id);n++;seasonNote(m.id);const g=applyRP(missionRP(m),null);toast(`${cheer()} Mission complete · ${signed(g)} RP`,'up');sfx('mission')}
  if(n&&d.done.length===3&&!d.allDone){d.allDone=true;S.stats.missionDays++}
  save();checkBadges();
}
function missionsCard(){
  const d=D(),ms=todaysMissions();
  return `<div class="missions"><div class="mhead"><span class="pltitle">Daily missions</span><span class="ts">${d.done.length}/3 done · New missions at midnight</span></div>
  ${ms.map(m=>{const v=Math.min(m.val(d),m.goal),done=d.done.includes(m.id);return `<div class="mrow${done?' done':''}"><span class="mcheck">${done?ICON.check:''}</span>

}
